name: Daily Email Reminder

on:
  # 【停止中】メールの自動送信を止めているため、毎日の定期実行を無効化している。
  # 再開するときは下の schedule のコメントを外す。
  #
  # なお、このジョブが叩く Vercel エンドポイントは vol2 の「完全ローカル化」で
  # 廃止済みのため、現状そのまま有効化しても失敗する。再開する場合は送信先の見直しが要る。
  #
  # schedule:
  #   - cron: '0 9 * * *'   # 毎日 09:00 UTC = 日本時間 18:00

  # 手動実行のみ（テスト時）
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Vercel API
        env:
          VERCEL_DEPLOYMENT_URL: ${{ secrets.VERCEL_DEPLOYMENT_URL }}
        run: |
          echo "📧 リマインドメール送信プロセスを開始"

          # Vercel 関数を呼び出し
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://${VERCEL_DEPLOYMENT_URL}/api/send-reminders" \
            -H "Content-Type: application/json" \
            -d '{}')

          # レスポンスとステータスコードを分離
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          # ステータスコード確認
          if [ "$http_code" = "200" ]; then
            echo "✅ リマインドメール送信成功"
            exit 0
          else
            echo "❌ リマインドメール送信失敗 (HTTP $http_code)"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ リマインドメール送信に失敗しました"
          echo "詳細: Vercel ダッシュボードでログを確認してください"
