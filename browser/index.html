  cfgBgInterval.addEventListener("change", () => {
    state.settings.bgIntervalMin = Math.max(1, parseInt(cfgBgInterval.value, 10) || 10);
    renderSettings();
    save();
    restartBgTimer();
  });
  cfgApiKey.addEventListener("change", () => {
    state.settings.anthropicApiKey = cfgApiKey.value.trim();
    // キーを入力したらそのプロバイダに自動で切り替える（手順を減らす）
    if (state.settings.anthropicApiKey) state.settings.aiProvider = "anthropic";
    renderSettings();
    save();
  });
  cfgAiProvider.addEventListener("change", () => {
    state.settings.aiProvider = cfgAiProvider.value;
    save();
  });
  cfgGeminiKey.addEventListener("change", () => {
    state.settings.geminiApiKey = cfgGeminiKey.value.trim();
    if (state.settings.geminiApiKey) state.settings.aiProvider = "gemini";
    renderSettings();
    save();
  });
  // Ctrl+V が使えない環境向けのフォールバック：ボタン1つでクリップボードのキーを貼り付ける
  function wirePasteButton(btnId, apply) {
    document.getElementById(btnId).addEventListener("click", async () => {
      try {
        const text = (await navigator.clipboard.readText()).trim();
        if (!text) { toast("クリップボードが空です。先にキーをコピーしてください"); return; }
        apply(text);
        save();
        renderSettings();
        toast("APIキーを貼り付けました");
      } catch (e) {
        alert("クリップボードを読み取れませんでした。\nブラウザの許可ダイアログで「許可」を選ぶか、入力欄をクリックして Ctrl+V（右クリック→貼り付け）を試してください。");
      }
    });
  }
  wirePasteButton("btnPasteApiKey", v => {
    state.settings.anthropicApiKey = v;
    state.settings.aiProvider = "anthropic";
  });
  wirePasteButton("btnPasteGeminiKey", v => {
    state.settings.geminiApiKey = v;
    state.settings.aiProvider = "gemini";
  });

  // ---------------------------------------------------------------
  // リマインダーチェック（ドライラン。spec.md 4章のロジックを踏襲）
  // ---------------------------------------------------------------
  const reminderLog = document.getElementById("reminderLog");

  function getEmailByName(name) {
    const c = state.contacts.find(c => c.name.trim() === (name || "").trim());
    return c ? c.email.trim() : "";
  }

  function checkAndSendReminders() {
    const today = todayDate();
    let sentCount = 0, skipCount = 0;
    const lines = [];

    for (const task of state.tasks) {
      if (task.status === "完了") continue;
      if (task.sentFlag === "済") { skipCount++; continue; }

      const due = parseDue(task.due);
      if (!due) continue;

      const reminderDays = task.reminderDays > 0 ? task.reminderDays : state.settings.reminderDays;
      const daysLeft = daysBetween(today, due);

      if (daysLeft < 0) {
        task.sentFlag = "期日超過";
        lines.push(`[期日超過] ${task.name}（担当: ${task.assignee} / 期日: ${formatDate(due)}）`);
      } else if (daysLeft <= reminderDays) {
        const email = getEmailByName(task.assignee);
        if (email) {
          const subject = `【リマインド】${task.name}（期日：${formatDate(due)}）`;
          const bodyIntro = daysLeft === 0
            ? "本日が期日のタスクがあります。ご確認をお願いいたします。"
            : `期日まで残り ${daysLeft} 日となりました。ご対応をお願いいたします。`;
          const body = `${task.assignee} 様\n\n${bodyIntro}\n\n` +
            `━━━━━━━━━━━━━━━━━━━━━━━━\n` +
            `  タスク名：${task.name}\n` +
            `  期　　日：${formatDateJP(due)}\n` +
            `  残り日数：${daysLeft} 日\n` +
            `━━━━━━━━━━━━━━━━━━━━━━━━\n\n` +
            `このメールは${state.settings.signature}より自動送信されています。`;
          task.sentFlag = "済";
          sentCount++;
          lines.push(`[送信対象] To: ${email}\n件名: ${subject}\n${body}`);
        } else {
          task.sentFlag = "アドレス不明";
          lines.push(`[アドレス不明] ${task.name}（担当: ${task.assignee}）`);
        }
      }
    }

    save();
    renderBoard();

    let msg;
    if (sentCount > 0) {
      msg = `${sentCount} 件のリマインド対象を検出しました。\n（送信済みスキップ: ${skipCount} 件）\n※ブラウザ版は実際のメール送信を行いません（プレビューのみ）。\n\n`;
    } else {
      msg = `送信対象のタスクはありませんでした。\n（スキップ済: ${skipCount} 件）\n\n`;
    }
    reminderLog.textContent = msg + (lines.length ? lines.join("\n\n") : "");
    toast(sentCount > 0
      ? `${sentCount} 件のリマインド対象を検出しました`
      : "送信対象のタスクはありませんでした");
  }

  function resetSentFlags() {
    if (!confirm("送信済みフラグを全てリセットしますか？\n（「済」「アドレス不明」「期日超過」を全て空白に戻します）")) return;
    for (const task of state.tasks) task.sentFlag = "";
    save();
    renderBoard();
    reminderLog.textContent = "";
  }

  document.getElementById("btnCheck").addEventListener("click", checkAndSendReminders);
  document.getElementById("btnReset").addEventListener("click", resetSentFlags);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------------------------------------------------------------
  // 月別ボード（期日の月ごとにパネルを分割）
  // ---------------------------------------------------------------
  // カードは既定では タスク名/期日/達成状況 の3項目のみを表示する簡易表示。
  // クリックした（選択した）カードだけ、担当者・期日・ステータス・リマインド日数前・送信済み状況の詳細を展開する。
  const FONT_SIZE_SCALE = { small: 0.85, normal: 1, large: 1.25 };
  const SHADOW_PRESET = { none: "", normal: "0 2px 6px rgba(0,0,0,0.15)", strong: "0 8px 20px rgba(0,0,0,0.35)" };
  const TILE_SIZE_PRESET = {
    small: { tile: 32, badge: 22, font: 11 },
    normal: { tile: 44, badge: 30, font: 14 },
    large: { tile: 60, badge: 42, font: 18 }
  };
  const ICON_OPTIONS = [["", "なし"], ["📌", "📌"], ["⭐", "⭐"], ["🔥", "🔥"], ["📅", "📅"]];
  let selectedTaskId = null;
  let openMenuMonthKey = null;
  let searchQuery = "";
  let zCounter = state.tasks.reduce((max, t) => Math.max(max, t.z || 0), 0);
  let colZCounter = Object.values(state.boardPos).reduce((max, p) => Math.max(max, p.z || 0), 0);
  const kanbanColumns = document.getElementById("kanbanColumns");
  document.addEventListener("click", () => {
    if (openMenuMonthKey !== null) {
      openMenuMonthKey = null;
      renderBoard();
    }
  });

  // ボード背景の空きスペースをドラッグして、スクロールバーを出さずにパン移動する（カード/パネル自体のドラッグとは競合しないよう対象要素を限定）。
  const boardView = document.getElementById("boardView");
  boardView.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    if (e.target !== boardView && e.target !== kanbanColumns) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const startScrollLeft = boardView.scrollLeft, startScrollTop = boardView.scrollTop;
    boardView.classList.add("panning");

    function onMove(ev) {
      boardView.scrollLeft = startScrollLeft - (ev.clientX - startX);
      boardView.scrollTop = startScrollTop - (ev.clientY - startY);
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      boardView.classList.remove("panning");
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });

  function clampPos(wrap, x, y) {
    const cardW = 128, cardH = 70;
    const w = Math.max(wrap.clientWidth, cardW + 8);
    const h = Math.max(wrap.clientHeight, cardH + 8);
    return {
      x: Math.max(4, Math.min(x, w - cardW - 4)),
      y: Math.max(4, Math.min(y, h - cardH - 4))
    };
  }

  function ensureDefaultPos(tasks) {
    let assigned = false;
    tasks.forEach((t, i) => {
      if (!t.pos) {
        assigned = true;
        t.pos = { x: 6, y: 6 + i * 64 };
      }
    });
    return assigned;
  }

  // 月パネルの既定配置（未配置のキーにのみ、簡単なグリッド状の初期位置を割り当てる）。既定では折りたたみ状態（月名のみ）。
  function ensureColPos(keys) {
    let assigned = false;
    const perRow = 4, colW = 260, rowH = 320;
    keys.forEach((key, i) => {
      if (!state.boardPos[key]) {
        assigned = true;
        state.boardPos[key] = { x: (i % perRow) * colW, y: Math.floor(i / perRow) * rowH, z: 0, collapsed: false };
      }
    });
    return assigned;
  }

  // 月パネル同士が自由配置後にどこまで広がっても収まるよう、キャンバスのサイズを実測して合わせる
  function resizeBoardCanvas() {
    let maxRight = 0, maxBottom = 0;
    kanbanColumns.querySelectorAll(".kb-col").forEach(col => {
      maxRight = Math.max(maxRight, col.offsetLeft + col.offsetWidth);
      maxBottom = Math.max(maxBottom, col.offsetTop + col.offsetHeight);
    });
    kanbanColumns.style.width = (maxRight + 20) + "px";
    kanbanColumns.style.height = (maxBottom + 20) + "px";
  }

  // ---- ドラッグ&ドロップ演出ユーティリティ ----
  const REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // 着地時にドラッグ中の発光をふわっと消す（揺れ・バウンドは使わない）。CSSの --glow-drag と同じ影構成。
  const GLOW_ON = "0 0 0 1px rgba(96, 165, 250, 0.45), 0 0 26px 5px rgba(59, 130, 246, 0.30), 0 14px 40px rgba(15, 23, 42, 0.18)";
  const GLOW_OFF = "0 0 0 1px rgba(96, 165, 250, 0), 0 0 26px 5px rgba(59, 130, 246, 0), 0 14px 40px rgba(15, 23, 42, 0)";
  function glowFade(el) {
    if (REDUCED_MOTION || !el || !el.animate) return;
    el.animate([{ boxShadow: GLOW_ON }, { boxShadow: GLOW_OFF }], { duration: 450, easing: "ease-out" });
  }
  // ボード結合時などの軽いポップ（オーバーシュートしないイージングで揺れを出さない）
  function popAnimate(el) {
    if (REDUCED_MOTION || !el || !el.animate) return;
    el.animate([{ transform: "scale(0.96)" }, { transform: "scale(1)" }], { duration: 280, easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
  }

  // 月パネル自体のドラッグ移動（見出し部分をつかんで画面中の好きな位置へ）。
  // 見出しのクリック（＝移動しなかった場合）は折りたたみ⇔展開の切り替えになる。
  // Pointer Events ベース（マウス・タッチ・ペン共通）。傾きなどの揺れる演出は使わず、
  // ドラッグ中はぼんやりした発光だけで「持ち上がっている」ことを示す。
  function attachColDrag(col, key) {
    const hdr = col.querySelector(".kb-col-hdr");
    let suppressClick = false;

    hdr.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      if (e.target.closest("button")) return; // メニューボタン等はドラッグ対象にしない
      e.preventDefault();

      state.boardPos[key].z = ++colZCounter;
      col.style.zIndex = state.boardPos[key].z;
      save();

      const startX = e.clientX, startY = e.clientY;
      const containerRect = kanbanColumns.getBoundingClientRect();
      const colRect = col.getBoundingClientRect();
      const offsetX = startX - colRect.left;
      const offsetY = startY - colRect.top;
      let moved = false;
      let mergeTarget = null;

      function onMove(ev) {
        if (!moved && (Math.abs(ev.clientX - startX) > 3 || Math.abs(ev.clientY - startY) > 3)) {
          moved = true;
          col.classList.add("dragging-col");
          // ドラッグ中は自分を素通しにして、真下のボードを elementFromPoint で検出できるようにする
          col.style.pointerEvents = "none";
          document.body.style.cursor = "grabbing";
        }
        if (!moved) return;
        const x = Math.max(0, ev.clientX - containerRect.left - offsetX);
        const y = Math.max(0, ev.clientY - containerRect.top - offsetY);
        col.style.left = x + "px";
        col.style.top = y + "px";
        // 別ボードに重ねたら結合候補としてハイライト
        document.querySelectorAll(".kb-col.drop-target").forEach(c => c.classList.remove("drop-target"));
        const under = document.elementFromPoint(ev.clientX, ev.clientY);
        const target = under && under.closest(".kb-col");
        mergeTarget = (target && target !== col && canMergeBoards(key, target.dataset.board)) ? target : null;
        if (mergeTarget) mergeTarget.classList.add("drop-target");
        resizeBoardCanvas();
      }
      function onUp() {
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onUp);
        document.body.style.cursor = "";
        if (!moved) return;
        suppressClick = true;
        // ドラッグ後のclickは同期的に発火するため、発火しなかった場合に備えて直後にフラグを戻す
        // （残留すると次の正当なヘッダークリックが1回無視されてしまう）
        setTimeout(() => { suppressClick = false; }, 0);
        col.classList.remove("dragging-col");
        col.style.pointerEvents = "";
        document.querySelectorAll(".kb-col.drop-target").forEach(c => c.classList.remove("drop-target"));
        if (mergeTarget) {
          mergeBoards(key, mergeTarget.dataset.board);
          return;
        }
        state.boardPos[key].x = parseFloat(col.style.left);
        state.boardPos[key].y = parseFloat(col.style.top);
        save();
        resizeBoardCanvas();
        // 着地：ドラッグ中の発光がふわっと消える
        glowFade(col);
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });

    hdr.addEventListener("click", () => {
      if (suppressClick) { suppressClick = false; return; }
      state.boardPos[key].collapsed = !state.boardPos[key].collapsed;
      save();
      renderBoard();
    });
  }

  const COL_MIN_W = 90, COL_HEADER_H = 34, COL_MIN_H = COL_HEADER_H;

  // 月パネル右下のハンドルをドラッグして大きさを自由に変更する。
  // 見出しの高さまで縮めると、折りたたみ状態（月名のみ表示）に切り替わる。
  function attachColResize(col, key) {
    const handle = document.createElement("div");
    handle.className = "kb-col-resize";
    handle.addEventListener("mousedown", e => {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const startX = e.clientX, startY = e.clientY;
      const startW = col.offsetWidth, startH = col.offsetHeight;
      let requestedW = startW, requestedH = startH;

      function onMove(ev) {
        requestedW = Math.max(COL_MIN_W, startW + (ev.clientX - startX));
        requestedH = Math.max(COL_MIN_H, startH + (ev.clientY - startY));
        col.style.width = requestedW + "px";
        col.style.height = requestedH + "px";
        resizeBoardCanvas();
      }
      function onUp() {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        // flexboxの子要素は内容サイズより縮まないため、実測値ではなく要求値で折りたたみ判定する
        const isMin = requestedH <= COL_HEADER_H + 6;
        state.boardPos[key].w = requestedW;
        if (!isMin) state.boardPos[key].h = requestedH;
        state.boardPos[key].collapsed = isMin;
        save();
        renderBoard();
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
    col.appendChild(handle);
  }

  // カードのドラッグ移動（Pointer Events ベース）。持ち上げるとわずかに拡大してぼんやり発光し、
  // 元の位置には破線のゴーストが残る。傾き・バウンドといった揺れる演出は使わない。
  function attachCardDrag(card, task) {
    card.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      if (e.target.closest("[data-detail]") || e.target.classList.contains("kb-card-resize")) return;
      e.preventDefault();

      // 重なったカードをクリック/ドラッグしたときに最前面へ出す
      task.z = ++zCounter;
      card.style.zIndex = (task.id === selectedTaskId ? 1000 : 0) + task.z;
      save();

      const startX = e.clientX, startY = e.clientY;
      const originWrap = card.parentElement;
      const originCol = card.closest(".kb-col");
      const originKey = originCol ? originCol.dataset.board : null;
      const cardRect = card.getBoundingClientRect();
      const offsetX = startX - cardRect.left;
      const offsetY = startY - cardRect.top;
      let moved = false;
      let ghost = null;
      let prevInlineW = "", prevInlineH = "";

      function onMove(ev) {
        if (!moved && (Math.abs(ev.clientX - startX) > 3 || Math.abs(ev.clientY - startY) > 3)) {
          moved = true;
          card.classList.add("dragging");
          document.body.style.cursor = "grabbing";
          // 持ち上げた元の位置に破線のプレースホルダーを残す
          ghost = document.createElement("div");
          ghost.className = "kb-card-ghost";
          ghost.style.left = card.offsetLeft + "px";
          ghost.style.top = card.offsetTop + "px";
          ghost.style.width = card.offsetWidth + "px";
          ghost.style.height = card.offsetHeight + "px";
          originWrap.appendChild(ghost);
          // 親の .kb-col は backdrop-filter を持つため position:fixed の基準が viewport ではなく
          // パネル自身になってしまう（containing block 化）。ドラッグ中だけ body 直下へ移して
          // fixed をviewport基準で正しく効かせる。見た目のサイズは持ち上げた時点の実寸で固定する。
          prevInlineW = card.style.width;
          prevInlineH = card.style.height;
          card.style.width = cardRect.width + "px";
          card.style.height = cardRect.height + "px";
          document.body.appendChild(card);
        }
        if (!moved) return;
        card.style.position = "fixed";
        card.style.left = (ev.clientX - offsetX) + "px";
        card.style.top = (ev.clientY - offsetY) + "px";
        card.style.zIndex = 99999;
        // .dragging は pointer-events:none のため、elementFromPoint はカード自身ではなく真下のボードを返す
        document.querySelectorAll(".kb-col.drop-target").forEach(c => c.classList.remove("drop-target"));
        const under = document.elementFromPoint(ev.clientX, ev.clientY);
        const col = under && under.closest(".kb-col");
        if (col) col.classList.add("drop-target");
      }

      function onUp(ev) {
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onUp);
        document.body.style.cursor = "";
        document.querySelectorAll(".kb-col.drop-target").forEach(c => c.classList.remove("drop-target"));
        if (!moved) return;
        // body 直下に出していたカードを元のボードに戻してからプレースホルダーを消す
        originWrap.insertBefore(card, ghost);
        ghost.remove();
        card.classList.remove("dragging");
        card.style.position = "";
        card.style.left = "";
        card.style.top = "";
        card.style.width = prevInlineW;
        card.style.height = prevInlineH;

        const under = document.elementFromPoint(ev.clientX, ev.clientY);
        const targetCol = under && under.closest(".kb-col");
        // 折りたたみボードへのドロップ等、カード置き場が無い場合は元のボード内に戻す
        const targetWrap = (targetCol && targetCol.querySelector(".kb-cards")) || originWrap;
        const wrapRect = targetWrap.getBoundingClientRect();
        task.pos = clampPos(targetWrap, ev.clientX - wrapRect.left - offsetX, ev.clientY - wrapRect.top - offsetY);

        // タスクの所属ボードのいずれかがドロップ先に含まれていれば移動不要（位置変更のみ）。
        // 含まれない場合は、元ボードの所属を外してドロップ先へ移す。
        if (targetCol && !taskBoardIds(task).some(id => boardsOfKey(targetCol.dataset.board).includes(id))) {
          moveTaskToBoard(task.id, originKey, targetCol.dataset.board);
        } else {
          save();
          renderBoard();
        }
        // 着地：ドラッグ中の発光がふわっと消える
        glowFade(kanbanColumns.querySelector(`.kb-card[data-task-id="${task.id}"]`));
      }

      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });
  }

  // カード右下のハンドルをドラッグして、カードの大きさを自由に変更する。サイズは task.size に保存。
  function attachCardResize(card, task, onResized) {
    const handle = document.createElement("div");
    handle.className = "kb-card-resize";
    handle.addEventListener("mousedown", e => {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const startX = e.clientX, startY = e.clientY;
      const startW = card.offsetWidth, startH = card.offsetHeight;
      let moved = false;

      function onMove(ev) {
        moved = true;
        card.style.width = Math.max(90, startW + (ev.clientX - startX)) + "px";
        card.style.height = Math.max(44, startH + (ev.clientY - startY)) + "px";
      }
      function onUp() {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        if (!moved) return;
        onResized();
        task.size = { w: parseFloat(card.style.width), h: parseFloat(card.style.height) };
        save();
        renderBoard();
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
    card.appendChild(handle);
  }

  // 担当者名から安定した色相を決める（同じ名前は常に同じ色のアバターになる）
  function avatarColor(name) {
    let h = 0;
    for (const ch of name.trim()) h = (h * 31 + ch.codePointAt(0)) % 360;
    return `hsl(${h}, 55%, 46%)`;
  }
  // 期日チップ：残り日数で緊急度を色分けする（期日超過=赤、3日以内=橙、完了タスクは常にニュートラル）
  function dueChipHtml(task, due) {
    if (!due) return `<span class="t-due">期日未設定</span>`;
    const left = daysBetween(todayDate(), due);
    let cls = "", extra = "";
    if (task.status !== "完了") {
      if (left < 0) { cls = " overdue"; extra = `・${-left}日超過`; }
      else if (left === 0) { cls = " soon"; extra = "・今日"; }
      else if (left <= 3) { cls = " soon"; extra = `・あと${left}日`; }
    }
    return `<span class="t-due${cls}" title="${escapeHtml(formatDate(due))}">📅 ${due.getMonth() + 1}/${due.getDate()}${extra}</span>`;
  }

  function buildCardEl(task, colKey) {
    const due = parseDue(task.due);
    const expanded = task.id === selectedTaskId;
    // 検索クエリに一致しないカードは薄く表示する（一致カードだけが浮かび上がる）
    const matches = !searchQuery
      || task.name.toLowerCase().includes(searchQuery)
      || (task.assignee || "").toLowerCase().includes(searchQuery);
    const card = document.createElement("div");
    card.className = `kb-card status-${task.status}` + (expanded ? " selected" : "") + (matches ? "" : " dimmed");
    card.dataset.taskId = task.id;
    card.style.left = task.pos.x + "px";
    card.style.top = task.pos.y + "px";
    card.style.zIndex = (expanded ? 1000 : 0) + (task.z || 0);
    // ユーザーがリサイズしたカードは保存済みサイズで表示する（展開時は詳細が収まる既定レイアウトを優先）
    if (!expanded && task.size) {
      card.style.width = task.size.w + "px";
      card.style.height = task.size.h + "px";
    }
    // 結合ボード上や複数ボード所属のタスクでは、どのボードのタスクか分かるよう所属バッジを表示する
    const memberBoardIds = taskBoardIds(task);
    const showBoardBadge = memberBoardIds.length > 1 || (colKey && isGroupKey(colKey));
    const boardBadge = !showBoardBadge ? "" : memberBoardIds
      .map(id => {
        const bc = boardHeaderColor(id);
        return `<span class="t-month" style="background:${bc.bg}; color:${bc.fg};">${escapeHtml((boardById(id) || { name: "?" }).name)}</span>`;
      })
      .join("");
    const assignee = (task.assignee || "").trim();
    card.innerHTML = `
      <div class="t-name">${escapeHtml(task.name)}</div>
      <div class="t-chips">${boardBadge}${dueChipHtml(task, due)}</div>
      <div class="t-foot">
        <span class="status-badge status-${task.status}">${task.status}</span>
        <span class="t-foot-right">
          ${assignee ? `<span class="t-avatar" style="background:${avatarColor(assignee)}" title="${escapeHtml(assignee)}">${escapeHtml([...assignee][0])}</span>` : ""}
          <span class="t-caret" aria-hidden="true"><svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </span>
      </div>
      ${expanded ? `
      <div class="t-detail" data-detail>
        <label><span class="f-label">👤 担当者</span>
          <input type="text" class="edit-assignee" value="${escapeHtml(task.assignee)}" list="assigneeList">
        </label>
        <label><span class="f-label">📅 期日 <span class="f-hint">yyyy/mm/dd</span></span>
          <input type="text" class="edit-due" value="${due ? formatDate(due) : escapeHtml(task.due || "")}">
        </label>
        <label><span class="f-label">📌 所属ボード <span class="f-hint">複数選択可</span></span>
          <span class="edit-months">
            ${state.boards.map(b => {
              const on = memberBoardIds.includes(b.id);
              return `<button type="button" class="em-btn${on ? " on" : ""}" data-bid="${b.id}"
                title="${on ? "クリックで所属から外す" : "クリックで所属に追加"}">${escapeHtml(b.name)}</button>`;
            }).join("")}
          </span>
        </label>
        <div class="kb-field">
          <span class="f-label">⚑ ステータス</span>
          <div class="kb-select" data-status-select>
            <button type="button" class="kb-select-trigger">
              <span class="kb-dot status-dot-${task.status}"></span>${task.status}
              <svg class="kb-select-caret" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="kb-select-menu">
              <div class="kb-select-menu-inner">
                ${STATUSES.map(s => `<button type="button" class="kb-select-opt${s === task.status ? " on" : ""}" data-value="${s}"><span class="kb-dot status-dot-${s}"></span>${s}${s === task.status ? `<span class="check">✓</span>` : ""}</button>`).join("")}
              </div>
            </div>
          </div>
        </div>
        <div class="t-chip-row">
          <span class="t-chip">🔔 ${task.reminderDays}日前に通知</span>
          <span class="t-chip">✉ ${task.sentFlag ? escapeHtml(task.sentFlag) : "未判定"}</span>
        </div>
        <button type="button" class="small edit-delete">🗑 タスクを削除</button>
      </div>` : ""}
    `;
    let cardResized = false;
    card.addEventListener("click", e => {
      if (e.target.closest("[data-detail]")) return;
      // リサイズ操作の直後や、ハンドル自体のクリックでは選択トグルしない
      if (cardResized || e.target.classList.contains("kb-card-resize")) return;
      selectedTaskId = expanded ? null : task.id;
      renderBoard();
    });
    attachCardDrag(card, task);
    if (!expanded) attachCardResize(card, task, () => { cardResized = true; });
    if (expanded) {
      card.querySelector(".edit-assignee").addEventListener("change", e => {
        task.assignee = e.target.value.trim();
        save();
        renderBoard();
      });
      card.querySelector(".edit-due").addEventListener("change", e => {
        const normalized = normalizeDueInput(e.target.value);
        if (!normalized) { alert("期日は yyyy/mm/dd 形式で入力してください。"); renderBoard(); return; }
        task.due = normalized;
        task.sentFlag = "";
        save();
        renderBoard();
      });
      // 所属ボードチップ：クリックで所属の追加/解除。選択した全ボードに同じタスク（共有情報）が表示される。
      // 最後の1つは外せない（タスクは必ずどこかのボードに属する）。
      card.querySelectorAll(".em-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.bid;
          const ids = taskBoardIds(task);
          const i = ids.indexOf(id);
          if (i >= 0) {
            if (ids.length === 1) { toast("最後の所属ボードは外せません"); return; }
            ids.splice(i, 1);
          } else {
            ids.push(id);
          }
          task.boards = ids;
          save();
          renderBoard();
        });
      });
      // ステータスのカスタムプルダウン：トリガーで開閉（矢印が回転してリストがスライド）、選択で即保存
      const statusSel = card.querySelector("[data-status-select]");
      statusSel.querySelector(".kb-select-trigger").addEventListener("click", () => {
        statusSel.classList.toggle("open");
      });
      statusSel.querySelectorAll(".kb-select-opt").forEach(opt => {
        opt.addEventListener("click", () => {
          task.status = opt.dataset.value;
          task.sentFlag = "";
          save();
          renderBoard();
        });
      });
      // 削除は即時反映しつつ、トーストの「元に戻す」で復元できる（確認ダイアログで操作を止めない）
      card.querySelector(".edit-delete").addEventListener("click", () => {
        const index = state.tasks.indexOf(task);
        state.tasks.splice(index, 1);
        selectedTaskId = null;
        save();
        renderBoard();
        toast(`「${task.name}」を削除しました`, {
          actionLabel: "元に戻す",
          onAction: () => {
            state.tasks.splice(Math.min(index, state.tasks.length), 0, task);
            save();
            renderBoard();
          }
        });
      });
    }
    return card;
  }

  function renderBoard() {
    kanbanColumns.innerHTML = "";
    const boardKeys = getBoardKeys();
    let needsSave = ensureColPos(boardKeys);
    for (const key of boardKeys) {
      const memberIds = boardsOfKey(key);
      const pos = state.boardPos[key];
      const collapsed = !!pos.collapsed;
      const tileSize = TILE_SIZE_PRESET[pos.tileSize || "normal"];
      const col = document.createElement("div");
      col.className = "kb-col" + (collapsed ? " collapsed" : "");
      col.dataset.board = key;
      col.style.left = pos.x + "px";
      col.style.top = pos.y + "px";
      col.style.zIndex = pos.z || 0;
      // 結合ボードの折りたたみタイルは「7,8」のようにラベルが長くなるため幅を内容に合わせる
      col.style.width = collapsed
        ? (isGroupKey(key) ? "auto" : tileSize.tile + "px")
        : (pos.w || 240) + "px";
      if (!collapsed && pos.h) col.style.height = pos.h + "px";
      col.style.borderStyle = pos.border === "double" ? "double" : "";
      col.style.borderWidth = pos.border === "double" ? "4px" : "";
      col.style.setProperty("--kb-font-scale", FONT_SIZE_SCALE[pos.fontSize || "normal"]);
      col.style.boxShadow = SHADOW_PRESET[pos.shadow || "none"] || "";

      // 所属ボードのいずれかがこのボードに含まれるタスクを表示する。
      // 結合ボードでは各ボードのタスクを足し合わせた一覧になり（同一タスクは1枚）、
      // 分離時は複数ボード所属のタスクが双方のボードに同じ情報（共有）で表示される。
      const tasks = state.tasks.filter(t => taskBoardIds(t).some(id => memberIds.includes(id)));

      const hdr = document.createElement("div");
      hdr.className = "kb-col-hdr" + (collapsed ? " kb-col-hdr-collapsed" : "");
      if (collapsed && pos.shape === "circle") {
        col.style.borderRadius = "50%";
        hdr.style.borderRadius = "50%";
      } else {
        col.style.borderRadius = "";
        hdr.style.borderRadius = "";
      }
      const { bg, fg } = boardHeaderColor(key);
      hdr.style.color = fg;
      // 単色の上に上端の光沢グラデーションを重ねて、立体感のあるヘッダーにする
      hdr.style.background = `linear-gradient(180deg, rgba(255,255,255,0.20), rgba(255,255,255,0.02) 60%), ${bg}`;
      // 折りたたみタイルの外枠を、達成率10段階ぶん時計回りに描く進捗リングにする（padding分の隙間にcolの背景=conic-gradientを覗かせる）。
      const completionStep = collapsed ? monthCompletionStep(tasks) : null;
      if (completionStep !== null) {
        const angle = completionStep * 3.6;
        col.style.padding = "3px";
        col.style.background = `conic-gradient(var(--green) 0deg ${angle}deg, var(--border) ${angle}deg 360deg)`;
        col.title = `達成率: ${completionStep}%`;
      } else {
        col.style.padding = "";
        col.style.background = "";
        col.title = "";
      }

      if (collapsed) {
        const nameBadge = document.createElement("span");
        nameBadge.className = "kb-col-count kb-col-count-lg";
        nameBadge.textContent = boardShortLabel(key);
        if (isGroupKey(key) || [...nameBadge.textContent].length > 1) {
          // 2文字以上のラベルは丸に収まらないため、横に伸びるピル型にする
          nameBadge.style.minWidth = tileSize.badge + "px";
          nameBadge.style.width = "auto";
          nameBadge.style.padding = "0 8px";
          nameBadge.style.borderRadius = "999px";
        } else {
          nameBadge.style.width = tileSize.badge + "px";
        }
        nameBadge.style.height = tileSize.badge + "px";
        nameBadge.style.fontSize = tileSize.font + "px";
        hdr.appendChild(nameBadge);
        if (pos.icon) {
          const iconSpan = document.createElement("span");
          iconSpan.className = "kb-col-tile-icon";
          iconSpan.textContent = pos.icon;
          col.appendChild(iconSpan);
        }
      } else {
        const hdrLabel = document.createElement("span");
        hdrLabel.className = "kb-col-hdr-label";
        hdrLabel.textContent = (pos.icon ? pos.icon + " " : "") + "▼ " + boardLabel(key);
        hdr.appendChild(hdrLabel);
        if (tasks.length > 0) {
          const countBadge = document.createElement("span");
          countBadge.className = "kb-col-count";
          countBadge.textContent = tasks.length;
          countBadge.title = `タスク ${tasks.length} 件`;
          hdr.appendChild(countBadge);
        }
        const pct = monthCompletionPercent(tasks);
        if (pct !== null) {
          const pctBadge = document.createElement("span");
          pctBadge.className = "kb-col-pct-badge";
          pctBadge.textContent = pct + "%";
          hdr.appendChild(pctBadge);
        }
        const menuBtn = document.createElement("button");
        menuBtn.type = "button";
        menuBtn.className = "kb-col-menu-btn";
        menuBtn.textContent = "☰";
        menuBtn.title = "メニュー";
        menuBtn.addEventListener("mousedown", e => e.stopPropagation());
        menuBtn.addEventListener("click", e => {
          e.stopPropagation();
          openMenuMonthKey = (openMenuMonthKey === key) ? null : key;
          renderBoard();
        });
        hdr.appendChild(menuBtn);
      }
      col.appendChild(hdr);
      // ヘッダー直下に達成率のプログレスバーを敷く（タスクのある展開ボードのみ）
      if (!collapsed && tasks.length > 0) {
        const progress = document.createElement("div");
        progress.className = "kb-col-progress";
        const fill = document.createElement("i");
        fill.style.width = monthCompletionPercent(tasks) + "%";
        progress.appendChild(fill);
        col.appendChild(progress);
      }
      attachColDrag(col, key);

      if (!collapsed) {
        const cardsWrap = document.createElement("div");
        cardsWrap.className = "kb-cards";
        // 空きスペースをダブルクリックすると、このボードのタスク追加ダイアログを開く
        cardsWrap.addEventListener("dblclick", e => {
          if (e.target !== cardsWrap && !e.target.classList.contains("empty-msg")) return;
          openTaskDialog({ boardId: memberIds[0] });
        });
        if (tasks.length === 0) {
          cardsWrap.innerHTML = `<div class="empty-msg">タスクなし<br>ダブルクリックで追加</div>`;
        } else {
          if (ensureDefaultPos(tasks)) needsSave = true;
          if (!pos.h) {
            const maxY = Math.max(...tasks.map(t => t.pos.y + 90));
            cardsWrap.style.minHeight = Math.max(220, maxY) + "px";
          }
          for (const task of tasks) cardsWrap.appendChild(buildCardEl(task, key));
        }
        col.appendChild(cardsWrap);

        if (openMenuMonthKey === key) {
          const menu = document.createElement("div");
          menu.className = "kb-col-menu";
          menu.addEventListener("click", e => e.stopPropagation());
          menu.addEventListener("mousedown", e => e.stopPropagation());

          const addBtn = document.createElement("button");
          addBtn.type = "button";
          addBtn.className = "kb-col-menu-item";
          addBtn.textContent = "+ タスク追加";
          addBtn.addEventListener("click", () => {
            openMenuMonthKey = null;
            renderBoard();
            openTaskDialog({ boardId: memberIds[0] });
          });
          menu.appendChild(addBtn);

          if (!isGroupKey(key)) {
            const renameBtn = document.createElement("button");
            renameBtn.type = "button";
            renameBtn.className = "kb-col-menu-item";
            renameBtn.textContent = "✏ 名前を変更";
            renameBtn.addEventListener("click", () => {
              openMenuMonthKey = null;
              renameBoard(key);
            });
            menu.appendChild(renameBtn);

            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "kb-col-menu-item";
            delBtn.textContent = "🗑 ボードを削除";
            delBtn.addEventListener("click", () => {
              openMenuMonthKey = null;
              deleteBoard(key);
            });
            menu.appendChild(delBtn);
          }

          if (isGroupKey(key)) {
            // 結合解除：どのボードを分離するか選べる（1枚ずつ分離 or すべて解除）
            const unmergeLabel = document.createElement("div");
            unmergeLabel.className = "kb-col-menu-label";
            unmergeLabel.textContent = "結合を解除（分離するボードを選択）";
            unmergeLabel.style.cssText = "padding:6px 8px 2px; font-size:0.9em; color:var(--muted); font-weight:600;";
            menu.appendChild(unmergeLabel);

            memberIds.forEach(id => {
              const b = boardById(id);
              if (!b) return;
              const item = document.createElement("button");
              item.type = "button";
              item.className = "kb-col-menu-item";
              item.textContent = `↳ 「${b.name}」を分離`;
              item.addEventListener("click", () => {
                openMenuMonthKey = null;
                detachBoardFromGroup(key, id);
              });
              menu.appendChild(item);
            });

            const unmergeAllBtn = document.createElement("button");
            unmergeAllBtn.type = "button";
            unmergeAllBtn.className = "kb-col-menu-item";
            unmergeAllBtn.textContent = "↳ すべて解除";
            unmergeAllBtn.addEventListener("click", () => {
              openMenuMonthKey = null;
              unmergeBoard(key);
            });
            menu.appendChild(unmergeAllBtn);
          }

          [["settings", "設定"], ["reminder", "リマインダー"], ["contacts", "名簿"]].forEach(([panelKey, label]) => {
            const item = document.createElement("button");
            item.type = "button";
            item.className = "kb-col-menu-item";
            item.textContent = label;
            item.addEventListener("click", () => {
              openMenuMonthKey = null;
              renderBoard();
              // 月メニューからの名簿は、そのボードのタスク参加者のみに絞った名簿を表示する
              if (panelKey === "contacts") {
                contactsScopeKey = key;
                renderContacts();
              }
              openPanelModal(panelKey);
            });
            menu.appendChild(item);
          });

          const buildSelectRow = (labelText, options, currentValue, onPick) => {
            const row = document.createElement("label");
            row.className = "kb-col-menu-field-row";
            row.textContent = labelText;
            const select = document.createElement("select");
            options.forEach(([val, optLabel]) => {
              const opt = document.createElement("option");
              opt.value = val;
              opt.textContent = optLabel;
              if (currentValue === val) opt.selected = true;
              select.appendChild(opt);
            });
            select.addEventListener("change", () => {
              onPick(select.value);
              save();
              renderBoard();
            });
            row.appendChild(select);
            return row;
          };

          const colorRow = document.createElement("label");
          colorRow.className = "kb-col-menu-field-row";
          colorRow.textContent = "色";
          const colorInput = document.createElement("input");
          colorInput.type = "color";
          colorInput.value = bg;
          colorInput.addEventListener("change", () => {
            state.boardPos[key].color = colorInput.value;
            save();
            renderBoard();
          });
          colorRow.appendChild(colorInput);
          menu.appendChild(colorRow);

          menu.appendChild(buildSelectRow("形（折りたたみ時）", [["square", "四角"], ["circle", "〇"]],
            pos.shape || "square", v => { state.boardPos[key].shape = v; }));

          menu.appendChild(buildSelectRow("枠線", [["normal", "通常"], ["double", "二重"]],
            pos.border || "normal", v => { state.boardPos[key].border = v; }));

          menu.appendChild(buildSelectRow("文字サイズ", [["small", "小"], ["normal", "標準"], ["large", "大"]],
            pos.fontSize || "normal", v => { state.boardPos[key].fontSize = v; }));

          menu.appendChild(buildSelectRow("影の強さ", [["none", "なし"], ["normal", "標準"], ["strong", "強"]],
            pos.shadow || "none", v => { state.boardPos[key].shadow = v; }));

          menu.appendChild(buildSelectRow("折りたたみの大きさ", [["small", "小"], ["normal", "標準"], ["large", "大"]],
            pos.tileSize || "normal", v => { state.boardPos[key].tileSize = v; }));

          menu.appendChild(buildSelectRow("アイコン", ICON_OPTIONS,
            pos.icon || "", v => { state.boardPos[key].icon = v; }));

          col.appendChild(menu);
        }

        attachColResize(col, key);
      }

      kanbanColumns.appendChild(col);
    }
    if (needsSave) save();
    resizeBoardCanvas();
  }

  // タスクを別ボードへ移す：移動元ボード（結合中なら全メンバー）の所属を外し、移動先の先頭ボードへ加える。
  // ボードと期日は独立しているため、期日は変更しない。
  function moveTaskToBoard(taskId, fromKey, toKey) {
    const task = state.tasks.find(t => t.id === taskId);
    if (!task || !toKey) return;
    const fromIds = fromKey ? boardsOfKey(fromKey) : [];
    const toIds = boardsOfKey(toKey);
    let ids = taskBoardIds(task).filter(id => !fromIds.includes(id));
    if (!ids.some(id => toIds.includes(id))) ids.push(toIds[0]);
    task.boards = ids;
    save();
    renderBoard();
  }

  // ---- タスク追加ダイアログ ----
  const taskDialog = document.getElementById("taskDialog");
  const taskForm = document.getElementById("taskForm");
  const taskName = document.getElementById("taskName");
  const taskAssignee = document.getElementById("taskAssignee");
  const taskDue = document.getElementById("taskDue");
  const taskReminderDays = document.getElementById("taskReminderDays");
  const assigneeList = document.getElementById("assigneeList");

  // 追加先ボード。指定がなければ先頭ボード（ボードが無ければ自動作成）に入る。
  let dialogBoardId = null;
  function openTaskDialog({ boardId } = {}) {
    taskForm.reset();
    taskName.value = "";
    taskAssignee.value = "";
    if (!state.boards.length) createBoard("ボード1");
    dialogBoardId = (boardId && boardById(boardId)) ? boardId : state.boards[0].id;
    const d = new Date();
    d.setDate(d.getDate() + 7);
    taskDue.value = formatDate(d);
    taskReminderDays.value = 3;
    assigneeList.innerHTML = state.contacts.map(c => `<option value="${escapeHtml(c.name)}">`).join("");
    document.getElementById("taskDialogTitle").textContent = `タスク追加（${boardById(dialogBoardId).name}）`;
    taskDialog.showModal();
  }

  document.getElementById("taskCancel").addEventListener("click", () => taskDialog.close());

  taskForm.addEventListener("submit", e => {
    e.preventDefault();
    const due = normalizeDueInput(taskDue.value);
    if (!due) { alert("期日は yyyy/mm/dd 形式で入力してください。"); return; }
    const newTask = {
      id: state.nextTaskId++,
      name: taskName.value.trim(),
      assignee: taskAssignee.value.trim(),
      due,
      reminderDays: Math.max(0, parseInt(taskReminderDays.value, 10) || 0),
      status: "未完了",
      sentFlag: "",
      boards: [dialogBoardId && boardById(dialogBoardId) ? dialogBoardId : state.boards[0].id]
    };
    state.tasks.push(newTask);
    save();
    taskDialog.close();
    renderBoard();
    toast(`「${newTask.name}」を追加しました`);
  });

  // ---------------------------------------------------------------
  // 名簿
  // ---------------------------------------------------------------
  const contactBody = document.getElementById("contactBody");
  const contactsTitle = document.getElementById("contactsTitle");
  const btnAddContact = document.getElementById("btnAddContact");
  // 名簿の表示スコープ。null=総合名簿（全員）、ボードキー=その月（結合ボード）のタスク参加者のみ
  let contactsScopeKey = null;
  // 名前をクリックして担当タスク一覧を展開中の担当者名
  let expandedContactName = null;

  function tasksOfContact(c) {
    const scopeIds = contactsScopeKey ? boardsOfKey(contactsScopeKey) : null;
    return state.tasks.filter(t =>
      (t.assignee || "").trim() === c.name.trim() &&
      (!scopeIds || taskBoardIds(t).some(id => scopeIds.includes(id))));
  }

  // 名簿から選んだタスクへジャンプ：該当ボードを展開・最前面にし、カードを選択状態にする
  function jumpToTask(task) {
    panelModal.close();
    selectedTaskId = task.id;
    const first = taskBoardIds(task)[0];
    const g = findGroup(first);
    const boardKey = g ? groupKeyOf(g) : first;
    if (state.boardPos[boardKey]) {
      state.boardPos[boardKey].collapsed = false;
      state.boardPos[boardKey].z = ++colZCounter;
    }
    save();
    renderBoard();
    const col = kanbanColumns.querySelector(`.kb-col[data-board="${boardKey}"]`);
    if (col) col.scrollIntoView({ block: "nearest", inline: "nearest" });
    toast(`「${task.name}」を選択しました`);
  }

  function renderContacts() {
    const scoped = contactsScopeKey !== null;
    contactsTitle.textContent = scoped ? `名簿（${boardLabel(contactsScopeKey)}の参加者）` : "名簿（総合）";
    // 月別の参加者名簿では総合名簿への追加操作は出さない
    btnAddContact.style.display = scoped ? "none" : "";
    contactBody.innerHTML = "";
    const list = scoped ? state.contacts.filter(c => tasksOfContact(c).length > 0) : state.contacts;
    if (list.length === 0) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="5" style="padding:10px 8px; color:var(--muted);">${
        scoped ? "このボードのタスクに参加している担当者はいません" : "担当者が登録されていません"}</td>`;
      contactBody.appendChild(tr);
      return;
    }
    for (const c of list) {
      const tasks = tasksOfContact(c);
      const expanded = expandedContactName === c.name;
      const tr = document.createElement("tr");
      tr.style.cursor = "pointer";
      tr.title = "クリックで担当タスクを表示";
      tr.innerHTML = `
        <td style="padding:6px 8px; border-bottom:1px solid var(--border);">${expanded ? "▾" : "▸"} ${escapeHtml(c.name)}</td>
        <td style="padding:6px 8px; border-bottom:1px solid var(--border);">${escapeHtml(c.email)}</td>
        <td style="padding:6px 8px; border-bottom:1px solid var(--border);">${escapeHtml(c.dept || "")}</td>
        <td style="padding:6px 8px; border-bottom:1px solid var(--border);">${tasks.length} 件</td>
        <td style="padding:6px 8px; border-bottom:1px solid var(--border); text-align:right;">
          <button class="danger small btn-del-contact">削除</button>
        </td>
      `;
      tr.addEventListener("click", e => {
        if (e.target.closest(".btn-del-contact")) return;
        expandedContactName = expanded ? null : c.name;
        renderContacts();
      });
      tr.querySelector(".btn-del-contact").addEventListener("click", () => {
        if (!confirm(`「${c.name}」を名簿から削除しますか？`)) return;

  // ---------------------------------------------------------------
  const toastsEl = document.getElementById("toasts");
  function toast(message, opts = {}) {
    // popoverとして再表示することで、開いているモーダルダイアログよりも手前（トップレイヤー最上位）に出す
    if (toastsEl.showPopover) {
      try { toastsEl.hidePopover(); } catch (e) { /* 未表示なら無視 */ }
      try { toastsEl.showPopover(); } catch (e) { /* 非対応ブラウザは通常表示 */ }
    }
    const el = document.createElement("div");
    el.className = "toast";
    const span = document.createElement("span");
    span.textContent = message;
    el.appendChild(span);
    let dismissed = false;
    function dismiss() {
      if (dismissed) return;
      dismissed = true;
      el.classList.add("hide");
      setTimeout(() => el.remove(), 300);
    }
    if (opts.actionLabel && opts.onAction) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = opts.actionLabel;
      btn.addEventListener("click", () => { opts.onAction(); dismiss(); });
      el.appendChild(btn);
    }
    toastsEl.appendChild(el);
    setTimeout(dismiss, opts.duration || 4500);
  }

  function buildAiSystemPrompt() {
    const today = formatDate(todayDate());
    const tasks = state.tasks.map(t => ({
      id: t.id, name: t.name, assignee: t.assignee || null,
      due: t.due || null, status: t.status,
      boards: taskBoardIds(t).map(id => (boardById(id) || { name: "?" }).name),
      reminderDays: t.reminderDays, sentFlag: t.sentFlag || null
    }));
    const contacts = state.contacts.map(c => ({ name: c.name, dept: c.dept || null }));

ユーザーのタスク管理を日本語で手伝います。回答は簡潔に。

今日の日付: ${today}

現在のタスク一覧（JSON）:
${JSON.stringify(tasks, null, 1)}

名簿（担当者一覧）:
${JSON.stringify(contacts, null, 1)}

ボード一覧:
${JSON.stringify(state.boards.map(b => b.name))}

結合中のボード:
${state.boardGroups.length ? JSON.stringify(state.boardGroups.map(g => g.map(id => (boardById(id) || { name: "?" }).name))) : "（なし）"}

アプリの仕様:
- タスクは所属するボード（複数可）に表示される。ボードは自由に作成・結合・分離できる（ステータス: ${STATUSES.join("/")}）

- タスクの追加・更新・削除はツールで実行できる。実行後は何をしたか短く報告する
- 変更を伴わない質問（集計・期限チェック・提案など）はタスク一覧から直接答える`;

  async function ensureAiClient() {
    const key = (state.settings.anthropicApiKey || "").trim();
    if (!key) throw Object.assign(new Error("APIキーが未設定です"), { code: "NO_KEY" });
    if (!AnthropicSDK) {
      const mod = await import("https://esm.run/@anthropic-ai/sdk");
      AnthropicSDK = mod.default;
    }
    if (!aiClient || aiClientKey !== key) {
      aiClient = new AnthropicSDK({ apiKey: key, dangerouslyAllowBrowser: true });
      aiClientKey = key;
    }
    return aiClient;
  }

  function aiAddMsg(cls, text) {
    const el = document.createElement("div");
    el.className = "ai-msg " + cls;
    el.textContent = text;
    aiMessages.appendChild(el);
    aiMessages.scrollTop = aiMessages.scrollHeight;
    return el;
  }

  // ボード名からボードを探す（完全一致優先、次に部分一致）
  function aiFindBoard(name) {
    const q = String(name || "").trim();
    if (!q) return null;
    return state.boards.find(b => b.name === q)
      || state.boards.find(b => b.name.includes(q) || q.includes(b.name))
      || null;
  }

  // ツール実行：state を直接更新して保存・再描画する。結果はAIへ文字列で返す。
  function execAiTool(name, input) {
    try {
      if (name === "add_task") {
        const due = normalizeDueInput(String(input.due || "").replace(/-/g, "/"));
        if (!due) return { content: "エラー: 期日は yyyy-mm-dd 形式で指定してください", isError: true };
        if (!state.boards.length) createBoard("ボード1");
        const targetBoard = (input.board && aiFindBoard(input.board)) || state.boards[0];
        const task = {
          id: state.nextTaskId++,
          name: String(input.name).trim(),
          assignee: (input.assignee || "").trim(),
          due,
          reminderDays: Math.max(0, parseInt(input.reminderDays, 10) || 3),
          status: "未完了",
          sentFlag: "",
          boards: [targetBoard.id]
        };
        state.tasks.push(task);
        save();
        renderBoard();
        toast(`AI: 「${task.name}」を追加しました`);
        return { content: `追加しました（id: ${task.id}）` };
      }
      if (name === "create_board") {
        const boardName = String(input.name || "").trim();
        if (!boardName) return { content: "エラー: ボード名を指定してください", isError: true };
        if (state.boards.some(b => b.name === boardName)) return { content: `エラー: 「${boardName}」ボードは既にあります`, isError: true };
        createBoard(boardName);
        toast(`AI: 「${boardName}」ボードを作成しました`);
        return { content: `「${boardName}」ボードを作成しました` };
      }
      if (name === "merge_boards") {
        const targets = [...new Set((input.boards || []).map(aiFindBoard).filter(Boolean).map(b => b.id))];
        if (targets.length < 2) return { content: "エラー: 結合する既存のボードを2つ以上指定してください", isError: true };
        // 指定ボードが既存の結合に含まれていれば、その結合ごと取り込む
        const all = new Set(targets);
        for (const id of [...all]) {
          const g = findGroup(id);
          if (g) g.forEach(x => all.add(x));
        }
        const list = [...all].sort();
        const newKey = groupKeyOf(list);
        state.boardGroups = state.boardGroups.filter(g => !g.some(m => all.has(m)));
        state.boardGroups.push(list);
        if (!state.boardPos[newKey]) state.boardPos[newKey] = Object.assign({}, state.boardPos[list[0]]);
        save();
        renderBoard();
        toast(`AI: 「${boardLabel(newKey)}」ボードに結合しました`);
        return { content: `「${boardLabel(newKey)}」ボードに結合しました` };
      }
      if (name === "unmerge_board") {
        const b = aiFindBoard(input.board);
        if (!b) return { content: `エラー: ボード「${input.board}」が見つかりません`, isError: true };
        const g = findGroup(b.id);
        if (!g) return { content: `エラー: 「${b.name}」は結合されていません`, isError: true };
        const gKey = groupKeyOf(g);
        const label = boardLabel(gKey);
        if (input.all) {
          unmergeBoard(gKey); // 内部で save・再描画・トーストまで行う
          return { content: `「${label}」ボードの結合をすべて解除しました` };
        }
        detachBoardFromGroup(gKey, b.id); // 内部で save・再描画・トーストまで行う
        return { content: `「${b.name}」を結合から分離しました` };
      }
      const task = state.tasks.find(t => t.id === Number(input.id));
      if (!task) return { content: `エラー: id ${input.id} のタスクが見つかりません`, isError: true };
      if (name === "update_task") {
        const changed = [];
        if (input.status && STATUSES.includes(input.status)) { task.status = input.status; task.sentFlag = ""; changed.push("ステータス→" + input.status); }
        if (input.due) {
          const due = normalizeDueInput(String(input.due).replace(/-/g, "/"));
          if (!due) return { content: "エラー: 期日は yyyy-mm-dd 形式で指定してください", isError: true };
          task.due = due; task.sentFlag = ""; changed.push("期日→" + due);
        }
        if (input.assignee !== undefined) { task.assignee = String(input.assignee).trim(); changed.push("担当者→" + task.assignee); }
        if (input.name) { task.name = String(input.name).trim(); changed.push("名前→" + task.name); }
        if (changed.length === 0) return { content: "エラー: 更新内容が指定されていません", isError: true };
        save();
        renderBoard();
        toast(`AI: 「${task.name}」を更新しました`);
        return { content: `更新しました: ${changed.join("、")}` };
      }
      if (name === "delete_task") {
        state.tasks = state.tasks.filter(t => t !== task);
        if (selectedTaskId === task.id) selectedTaskId = null;
        save();
        renderBoard();
        toast(`AI: 「${task.name}」を削除しました`);
        return { content: `「${task.name}」を削除しました` };
      }
      return { content: `エラー: 不明なツール ${name}`, isError: true };
    } catch (e) {
      return { content: "エラー: " + e.message, isError: true };
    }
  }

  // Claude でのターン処理：ストリーミング＋ツール実行の手動ループ
  async function aiTurnClaude(text, waitEl) {
    const client = await ensureAiClient();
    aiHistory.push({ role: "user", content: text });
    for (let iter = 0; iter < 8; iter++) {
      const stream = client.messages.stream({
        model: AI_MODEL,
        max_tokens: 16000,
        thinking: { type: "adaptive" },
        system: buildAiSystemPrompt(),
        tools: AI_TOOLS,
        messages: aiHistory
      });
      let bubble = null;
      stream.on("text", delta => {
        if (!bubble) {
          waitEl.remove();
          bubble = aiAddMsg("assistant", "");
        }
        bubble.textContent += delta;
        aiMessages.scrollTop = aiMessages.scrollHeight;
      });
      const msg = await stream.finalMessage();
      aiHistory.push({ role: "assistant", content: msg.content });

      if (msg.stop_reason !== "tool_use") break;
      const results = [];
      for (const block of msg.content) {
        if (block.type !== "tool_use") continue;
        aiAddMsg("info", `🔧 ${block.name} を実行`);
        const { content, isError } = execAiTool(block.name, block.input);
        const result = { type: "tool_result", tool_use_id: block.id, content };
        if (isError) result.is_error = true;
        results.push(result);
      }
      aiHistory.push({ role: "user", content: results });
    }
  }

  // Gemini でのターン処理：generateContent（REST・非ストリーミング）＋ function calling の手動ループ
  function geminiToolDecls() {
    // Gemini のスキーマは JSON Schema のサブセット。未対応の minimum/maximum は落とす
    return AI_TOOLS.map(t => ({
      name: t.name,
      description: t.description,
      parameters: JSON.parse(JSON.stringify(t.input_schema, (k, v) =>
        (k === "minimum" || k === "maximum") ? undefined : v))
    }));
  }
  async function aiTurnGemini(text, waitEl) {
    const key = (state.settings.geminiApiKey || "").trim();
    if (!key) throw new Error("Gemini APIキーが未設定です。⚙設定の「AI：Gemini APIキー」に入力してください（https://aistudio.google.com/apikey で発行できます）。");
    aiHistory.push({ role: "user", parts: [{ text }] });
    for (let iter = 0; iter < 8; iter++) {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: buildAiSystemPrompt() }] },
            contents: aiHistory,
            tools: [{ functionDeclarations: geminiToolDecls() }]
          })
        }
      );
      if (!res.ok) {
        let detail = "";
        try { const err = await res.json(); detail = err.error && err.error.message ? ": " + err.error.message : ""; } catch (_) { /* JSONでない場合は無視 */ }
        const hint = (res.status === 400 || res.status === 403) ? "\nAPIキーが正しいか確認してください。" : (res.status === 429 ? "\nレート制限です。少し待って再試行してください。" : "");
        throw new Error(`Gemini APIエラー（${res.status}）${detail}${hint}`);
      }
      const data = await res.json();
      const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      aiHistory.push({ role: "model", parts });

      const textOut = parts.filter(p => p.text).map(p => p.text).join("");
      if (textOut) {
        waitEl.remove();
        aiAddMsg("assistant", textOut);
      }
      const calls = parts.filter(p => p.functionCall);
      if (calls.length === 0) break;
      const resParts = calls.map(p => {
        aiAddMsg("info", `🔧 ${p.functionCall.name} を実行`);
        const { content, isError } = execAiTool(p.functionCall.name, p.functionCall.args || {});
        return { functionResponse: { name: p.functionCall.name, response: { result: content, is_error: !!isError } } };
      });
      aiHistory.push({ role: "user", parts: resParts });
    }
  }

  async function aiSend(text) {
    aiBusy = true;
    aiSendBtn.disabled = true;
    aiAddMsg("user", text);
    const provider = state.settings.aiProvider || "anthropic";
    // プロバイダを切り替えたら履歴の形式が変わるためリセットする
    if (aiHistoryProvider !== provider) {
      aiHistory = [];
      aiHistoryProvider = provider;
    }
    const historyLenBefore = aiHistory.length;
    const waitEl = aiAddMsg("info thinking-dots", "考え中");
    try {
      if (provider === "gemini") {
        await aiTurnGemini(text, waitEl);
      } else {
        await aiTurnClaude(text, waitEl);
      }
      waitEl.remove();
    } catch (e) {
      waitEl.remove();
      if (e.code === "NO_KEY") {
        aiAddMsg("error", "Anthropic APIキーが未設定です。⚙設定の「AI：Anthropic APIキー」に入力してください。");
      } else if (AnthropicSDK && e instanceof AnthropicSDK.AuthenticationError) {
        aiAddMsg("error", "APIキーが無効です。設定で正しいキーを入力してください。");
      } else if (AnthropicSDK && e instanceof AnthropicSDK.RateLimitError) {
        aiAddMsg("error", "レート制限に達しました。しばらく待ってから再試行してください。");
      } else if (AnthropicSDK && e instanceof AnthropicSDK.APIError) {
        aiAddMsg("error", `APIエラー（${e.status}）: ${e.message}`);
      } else {
        aiAddMsg("error", "エラー: " + e.message);
      }
      // 失敗したターンを丸ごと巻き戻す（tool_use と tool_result が対にならない不整合な履歴を残さない）
      aiHistory.length = historyLenBefore;
    } finally {
      aiBusy = false;
      aiSendBtn.disabled = false;
      aiInput.focus();
    }
  }

  // AIパネルのドラッグ移動：ヘッダー（ボタン以外）をつかんで好きな位置へ。位置は保存され次回も維持。
  function applyAiPanelPos() {
    if (!state.aiPanelPos) return;
    const x = Math.max(0, Math.min(state.aiPanelPos.x, window.innerWidth - 80));
    const y = Math.max(0, Math.min(state.aiPanelPos.y, window.innerHeight - 60));
    aiPanel.style.left = x + "px";
    aiPanel.style.top = y + "px";
    aiPanel.style.right = "auto";
    aiPanel.style.bottom = "auto";
  }
  aiPanel.querySelector(".ai-panel-hdr").addEventListener("mousedown", e => {
    if (e.button !== 0 || e.target.closest("button")) return;
    e.preventDefault();
    const rect = aiPanel.getBoundingClientRect();
    const offsetX = e.clientX - rect.left;
    const offsetY = e.clientY - rect.top;
    let moved = false;

    function onMove(ev) {
      moved = true;
      const x = Math.max(0, Math.min(ev.clientX - offsetX, window.innerWidth - 80));
      const y = Math.max(0, Math.min(ev.clientY - offsetY, window.innerHeight - 60));
      aiPanel.style.left = x + "px";
      aiPanel.style.top = y + "px";
      aiPanel.style.right = "auto";
      aiPanel.style.bottom = "auto";
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      if (!moved) return;
      state.aiPanelPos = { x: parseFloat(aiPanel.style.left) || 0, y: parseFloat(aiPanel.style.top) || 0 };
      save();
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
  // ウィンドウリサイズ時も画面外に出ないようクランプし直す
  window.addEventListener("resize", applyAiPanelPos);

  document.getElementById("btnOpenAi").addEventListener("click", () => {
    aiPanel.hidden = !aiPanel.hidden;
    if (!aiPanel.hidden) {
      applyAiPanelPos();
      if (aiMessages.children.length === 0) {
        aiAddMsg("assistant", "こんにちは！タスクについて何でも聞いてください。\n例:「今週締め切りのタスクは？」「来週金曜までに資料作成のタスクを追加して」「7月と8月を結合して」");
        const provider = state.settings.aiProvider || "anthropic";
        const hasKey = provider === "gemini"
          ? !!(state.settings.geminiApiKey || "").trim()
          : !!(state.settings.anthropicApiKey || "").trim();
        if (!hasKey) {
          aiAddMsg("error", provider === "gemini"
            ? "利用には Gemini APIキーが必要です。⚙設定の「AI：Gemini APIキー」に入力してください（https://aistudio.google.com/apikey で無料発行）。"
            : "利用には Anthropic APIキーが必要です。⚙設定の「AI：Anthropic APIキー」に入力してください。（GeminiのAPIキーでも利用できます。設定でGeminiキーを入力すると自動で切り替わります）");
        }
      }
      aiInput.focus();
    }
  });
  document.getElementById("aiClose").addEventListener("click", () => { aiPanel.hidden = true; });
  document.getElementById("aiClear").addEventListener("click", () => {
    aiHistory = [];
    aiMessages.innerHTML = "";
    aiAddMsg("info", "会話をクリアしました");
  });
  aiForm.addEventListener("submit", e => {
    e.preventDefault();
    const text = aiInput.value.trim();
    if (!text || aiBusy) return;
    aiInput.value = "";
    aiSend(text);
  });

  // ---------------------------------------------------------------
  // 背景：ネットからランダム画像を取得し、2枚のレイヤーでクロスフェード切替。
  // 設定した間隔で自動ローテーションし、取得失敗・オフライン時はグラデーションにフォールバックする。
  // ---------------------------------------------------------------
  const FALLBACK_GRADIENTS = [
    "linear-gradient(135deg, #f6d365, #fda085)",
    "linear-gradient(135deg, #a1c4fd, #c2e9fb)",
    "linear-gradient(135deg, #d4fc79, #96e6a1)",
    "linear-gradient(135deg, #fbc2eb, #a6c1ee)",
    "linear-gradient(135deg, #fddb92, #d1fdff)",
    "linear-gradient(135deg, #cfd9df, #e2ebf0)",
    "linear-gradient(135deg, #ffecd2, #fcb69f)",
    "linear-gradient(135deg, #a8edea, #fed6e3)",
    "linear-gradient(135deg, #d299c2, #fef9d7)",
    "linear-gradient(135deg, #89f7fe, #66a6ff)"
  ];
  const bgLayers = [document.getElementById("bgA"), document.getElementById("bgB")];
  let bgActive = 0;
  let bgTimer = null;

  function swapBgLayers(image) {
    const next = bgActive ^ 1;
    bgLayers[next].style.backgroundImage = image;
    bgLayers[bgActive].classList.remove("visible");
    bgLayers[next].classList.add("visible");
    bgActive = next;
  }

  function showGradientBackground() {
    swapBgLayers(FALLBACK_GRADIENTS[Math.floor(Math.random() * FALLBACK_GRADIENTS.length)]);
  }

  function changeBackground(notify) {
    if (!state.settings.bgOnline) {
      showGradientBackground();
      if (notify) toast("背景を変更しました（グラデーション）");
      return;
    }
    // picsum.photos: APIキー不要のランダム写真。seedを毎回変えて重複を避け、読み込み完了後にフェードインする。
    const seed = Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
    const url = `https://picsum.photos/seed/${seed}/1920/1080`;
    const img = new Image();
    img.onload = () => {
      swapBgLayers(`url("${url}")`);
      if (notify) toast("背景を変更しました");
    };
    img.onerror = () => {
      showGradientBackground();
      if (notify) toast("画像を取得できないため、グラデーション背景を使用します");
    };
    img.src = url;
  }

  function restartBgTimer() {
    if (bgTimer) clearInterval(bgTimer);
    const min = Math.max(1, state.settings.bgIntervalMin || 10);
    bgTimer = setInterval(() => changeBackground(false), min * 60000);
  }

  // ---------------------------------------------------------------
  // アプリバー（検索・クイック操作）とキーボードショートカット
  // ---------------------------------------------------------------
  const searchInput = document.getElementById("searchInput");
  searchInput.addEventListener("input", () => {
    searchQuery = searchInput.value.trim().toLowerCase();
    renderBoard();
  });

  document.getElementById("btnAddTaskTop").addEventListener("click", () => {
    openTaskDialog({});
  });
  document.getElementById("btnAddBoardTop").addEventListener("click", () => {
    const name = prompt("新しいボードの名前を入力してください", `ボード${state.boards.length + 1}`);
    if (name === null) return;
    createBoard(name);
  });
  document.getElementById("btnBgChange").addEventListener("click", () => changeBackground(true));
  document.getElementById("btnOpenSettings").addEventListener("click", () => openPanelModal("settings"));
  document.getElementById("btnOpenReminder").addEventListener("click", () => openPanelModal("reminder"));
  document.getElementById("btnOpenContacts").addEventListener("click", () => {
    // ヘッダーからの名簿は常に総合名簿（全員）
    contactsScopeKey = null;
    renderContacts();
    openPanelModal("contacts");
  });

  // N: タスク追加 / B: 背景変更 / "/": 検索へフォーカス / Esc: 検索クリア・選択解除・メニューを閉じる
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const anyDialogOpen = !!document.querySelector("dialog[open]");
    if (e.key === "Escape" && !anyDialogOpen) {
      if (document.activeElement === searchInput && searchInput.value) {
        searchInput.value = "";
        searchQuery = "";
        searchInput.blur();
        renderBoard();
      } else if (selectedTaskId !== null) {
        selectedTaskId = null;
        renderBoard();
      } else if (openMenuMonthKey !== null) {
        openMenuMonthKey = null;
        renderBoard();
      }
      return;
    }
    const tag = document.activeElement && document.activeElement.tagName;
    const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
    if (typing || anyDialogOpen) return;
    if (e.key === "n" || e.key === "N") {
      e.preventDefault();
      openTaskDialog({});
    } else if (e.key === "b" || e.key === "B") {
      e.preventDefault();
      changeBackground(true);
    } else if (e.key === "/") {
      e.preventDefault();
      searchInput.focus();
    }
  });

  function renderAll() {
    changeBackground(false);
    restartBgTimer();
    renderSettings();
    renderContacts();
    renderBoard();
    reminderLog.textContent = "";
  }

  renderAll();
})();
</script>
</body>
</html>
