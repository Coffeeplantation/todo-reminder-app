

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todoリマインダー（ブラウザ版）</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #3b82f6;
    --orange: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --bg: #e8edf5;
    --panel: rgba(255, 255, 255, 0.68);
    --panel-solid: #ffffff;
    --border: rgba(15, 23, 42, 0.12);
    --text: #0f172a;
    --muted: #5b6472;
    --accent: #2563eb;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 2px 10px rgba(15, 23, 42, 0.07);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.10), 0 12px 32px rgba(15, 23, 42, 0.14);
    --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.20), 0 24px 64px rgba(15, 23, 42, 0.24);
    --glass-blur: saturate(1.5) blur(18px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Segoe UI", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- ネット背景（2枚のレイヤーをクロスフェード） ---- */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -3;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.4s ease;
    pointer-events: none;
  }
  .bg-layer.visible { opacity: 1; }
  #bgScrim {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(15,23,42,0.28), rgba(15,23,42,0.06) 30%, rgba(15,23,42,0.14));
  }

  /* ---- アプリバー ---- */
  .appbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.62);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid rgba(255, 255, 255, 0.55);
    box-shadow: var(--shadow-sm);
  }
  .appbar-title {
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .appbar-search {
    flex: 1;
    min-width: 160px;
    max-width: 340px;
    position: relative;
  }
  .appbar-search input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.85);
    font-family: inherit;
    font-size: 13px;
  }
  .appbar-search::before {
    content: "🔍";
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    opacity: 0.6;
    pointer-events: none;
  }
  .appbar-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .appbar-hint {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  main {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
  }
  .panel h2 {
    font-size: 14px;
    margin: 0 0 10px;
    color: #1e2f52;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* ---- 設定・リマインダーチェック・名簿は画面に常時非表示。各月パネルのリンクから共有モーダルでのみ表示する ---- */
  .modal-only { display: none; }
  .settings-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 12px;
    align-items: center;
    max-width: 480px;
  }
  .settings-grid label { color: var(--muted); }
  .settings-grid input[type=text], .settings-grid input[type=number] {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 100%;
    font-family: inherit;
    font-size: 13px;
  }
  .settings-grid input[type=color] {
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 60px;
    height: 28px;
    cursor: pointer;
  }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: var(--blue);
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease, background 0.15s ease;
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
    filter: brightness(1.06);
  }
  button:active:not(:disabled) { transform: translateY(0); }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.secondary { background: var(--green); }
  button.danger { background: var(--red); }
  button.plain { background: #6b7280; }
  button.ghost {
    background: rgba(255, 255, 255, 0.78);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.ghost:hover:not(:disabled) { background: #fff; filter: none; }
  button.small { padding: 3px 8px; font-size: 11px; }
  button:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- スクロールバー / モーション設定 ---- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(15, 23, 42, 0.25);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: rgba(15, 23, 42, 0.4); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  /* ---- トースト通知（popover=トップレイヤー表示で、モーダルより手前に出す） ---- */
  #toasts {
    position: fixed;
    inset: auto 16px 16px auto;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
    margin: 0;
    padding: 0;
    border: none;
    background: transparent;
    overflow: visible;
    pointer-events: none;
  }
  #toasts .toast { pointer-events: auto; }
  #toasts:popover-open { display: flex; }
  .toast {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: min(420px, 90vw);
    background: rgba(17, 24, 39, 0.92);
    color: #fff;
    padding: 10px 14px;
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    font-size: 13px;
    animation: toast-in 0.25s ease;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .toast button {
    background: rgba(255, 255, 255, 0.16);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    box-shadow: none;
    flex: none;
  }
  .toast.hide { opacity: 0; transform: translateY(6px); transition: all 0.3s ease; }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  .status-badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    color: #fff;
  }
  .status-未完了 { background: var(--blue); }
  .status-進行中 { background: var(--orange); }
  .status-完了 { background: var(--green); }

  /* ---- kanban board ---- */
  #boardView { overflow: hidden; cursor: grab; min-height: 62vh; }
  #boardView.panning { cursor: grabbing; }
  .kanban-columns {
    position: relative;
  }
  .kb-col {
    position: absolute;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    min-height: 160px;
    box-shadow: var(--shadow-sm);
  }
  .kb-col.collapsed { min-height: 0; }
  .kb-col.current-month { box-shadow: 0 0 0 2px #ff8c00; }
  .kb-col.dragging-col { box-shadow: 0 12px 28px rgba(0,0,0,0.32); }
  .kb-col-hdr {
    font-weight: 700;
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 11px 11px 0 0;
    cursor: grab;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .kb-col-hdr-label {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .kb-col-count {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    font-size: 10px;
    line-height: 1;
    font-weight: bold;
  }
  .kb-col-hdr-collapsed {
    justify-content: center;
    padding: 8px;
  }
  .kb-col-count-lg {
    width: 30px;
    height: 30px;
    font-size: 14px;
  }
  .kb-col-pct-badge {
    flex: none;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(255,255,255,0.35);
    font-size: 10px;
    font-weight: bold;
    white-space: nowrap;
  }
  .kb-col-menu-btn {
    flex: none;
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 4px;
    background: rgba(255,255,255,0.25);
    color: inherit;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .kb-col-menu-btn:hover { background: rgba(255,255,255,0.4); }
  .kb-col.collapsed .kb-col-hdr { border-radius: 11px; }
  .kb-col.drop-target { box-shadow: inset 0 0 0 2px #ff8c00; }
  .kb-cards {
    flex: 1;
    padding: 8px;
    position: relative;
    min-height: 0;
    overflow: auto;
    font-size: calc(11px * var(--kb-font-scale, 1));
  }
  .kb-col-tile-icon {
    position: absolute;
    top: -6px;
    right: -6px;
    font-size: 14px;
    line-height: 1;
    z-index: 1;
  }
  .kb-col-menu {
    position: absolute;
    top: 36px;
    right: 6px;
    z-index: 50;
    background: rgba(255, 255, 255, 0.96);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 150px;
    animation: menu-in 0.15s ease;
  }
  @keyframes menu-in {
    from { opacity: 0; transform: translateY(-4px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }
  .kb-col-menu-item {
    text-align: left;
    background: none;
    border: none;
    padding: 6px 8px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: normal;
    color: var(--text);
    cursor: pointer;
    box-shadow: none;
  }
  .kb-col-menu-item:hover { background: #eef1f6; transform: none; filter: none; box-shadow: none; }
  .kb-col-menu-field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .kb-col-menu-field-row input[type=color] {
    width: 24px;
    height: 20px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
  }
  .kb-col-menu-field-row select {
    font-size: 12px;
    padding: 2px 4px;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
  }
  .kb-col-resize {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 15px;
    height: 15px;
    cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 0 45%, var(--muted) 45% 55%, transparent 55% 100%);
    border-radius: 0 0 6px 0;
  }
  .kb-card {
    position: absolute;
    width: 128px;
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-left: 4px solid #999;
    border-radius: 10px;
    padding: 6px 8px;
    font-size: 1em;
    line-height: 1.35;
    cursor: grab;
    touch-action: none;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s ease, opacity 0.2s ease, filter 0.2s ease;
  }
  .kb-card:hover { box-shadow: var(--shadow-md); }
  .kb-card.dimmed { opacity: 0.22; filter: grayscale(0.6); }
  .kb-card.selected {
    outline: 2px solid var(--accent);
    width: 220px;
    box-shadow: var(--shadow-md);
  }
  .kb-card.dragging {
    cursor: grabbing;
    box-shadow: var(--shadow-lg);
    opacity: 0.95;
    transition: none;
  }
  .kb-card .t-name {
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kb-card.selected .t-name { white-space: normal; }
  .kb-card .t-meta { color: var(--muted); display: flex; flex-direction: column; gap: 2px; margin-top: 3px; }
  .kb-card.selected .t-meta { flex-direction: row; justify-content: space-between; align-items: center; }
  .kb-card .status-badge { align-self: flex-start; font-size: 1em; }
  .kb-card .t-detail {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--border);
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 1.09em;
  }
  .kb-card .t-detail label { display: flex; flex-direction: column; gap: 2px; }
  .kb-card .t-detail input, .kb-card .t-detail select {
    padding: 3px 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: inherit;
    color: var(--text);
  }
  .kb-card.status-未完了 { border-left-color: var(--blue); }
  .kb-card.status-進行中 { border-left-color: var(--orange); }
  .kb-card.status-完了 { border-left-color: var(--green); }
  .empty-msg { color: var(--muted); font-size: 12px; padding: 10px; text-align: center; }

  /* ---- reminder log ---- */
  #reminderLog {
    max-height: 220px;
    overflow-y: auto;
    font-size: 12px;
    background: rgba(248, 250, 252, 0.9);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
    white-space: pre-wrap;
  }
  #reminderLog:empty::before { content: "（まだチェックを実行していません）"; color: var(--muted); }

  dialog {
    border: none;
    border-radius: var(--radius);
    padding: 0;
    width: 380px;
    max-width: 92vw;
    box-shadow: var(--shadow-lg);
  }
  dialog::backdrop {
    background: rgba(15, 23, 42, 0.45);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  dialog form { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  dialog h3 { margin: 0 0 4px; font-size: 15px; }
  dialog label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  dialog input {
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
  }
  dialog .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  dialog.panel-modal {
    width: 480px;
    max-width: 92vw;
  }
  .panel-modal-body {
    padding: 16px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .panel-modal-body .panel {
    border: none;
    padding: 0;
  }
  .panel-modal-body .modal-only { display: block; }
  .panel-modal-footer {
    padding: 0 16px 16px;
    display: flex;
    justify-content: flex-end;
  }

</style>
</head>
<body>

<!-- ネット背景（2枚をクロスフェード）＋可読性用スクリム -->
<div class="bg-layer" id="bgA"></div>
<div class="bg-layer" id="bgB"></div>
<div id="bgScrim"></div>

<!-- アプリバー：主要操作へ常時1クリックでアクセス -->
<header class="appbar">
  <span class="appbar-title">📋 Todoリマインダー</span>
  <span class="appbar-search">
    <input type="search" id="searchInput" placeholder="タスク・担当者を検索（/）" autocomplete="off">
  </span>
  <span class="appbar-actions">
    <button type="button" id="btnAddTaskTop" title="タスクを追加（N）">＋ タスク追加</button>
    <button type="button" id="btnBgChange" class="ghost" title="背景をランダムに変更（B）">🖼 背景</button>
    <button type="button" id="btnOpenReminder" class="ghost" title="リマインダーチェックを開く">🔔 リマインダー</button>
    <button type="button" id="btnOpenContacts" class="ghost" title="名簿を開く">👥 名簿</button>
    <button type="button" id="btnOpenSettings" class="ghost" title="設定を開く">⚙ 設定</button>
  </span>
</header>

<main>

  <section class="panel modal-only" id="sectionSettings">
    <h2>設定</h2>
    <div class="panel-body" id="settingsPanelBody">
      <div class="settings-grid">
        <label for="cfgReminderDays">既定のリマインド日数前</label>
        <input type="number" id="cfgReminderDays" min="0" value="3">

        <label for="cfgSignature">署名</label>
        <input type="text" id="cfgSignature" value="Todoリマインダーシステム">

        <label for="cfgAutoMail">自動メール送信（ON/OFF）</label>
        <span class="toggle">
          <input type="checkbox" id="cfgAutoMail">
          <span id="cfgAutoMailLabel">OFF（ブラウザ版は常にドライラン）</span>
        </span>

        <label for="cfgColorNear">月別ボード：現在月に近い色</label>
        <input type="color" id="cfgColorNear" value="#2b3f63">

        <label for="cfgColorFar">月別ボード：現在月から遠い色</label>
        <input type="color" id="cfgColorFar" value="#c4ced0">

        <label for="cfgBgOnline">背景：ネット画像を使う</label>
        <span class="toggle">
          <input type="checkbox" id="cfgBgOnline" checked>
          <span id="cfgBgOnlineLabel">ON（ネットからランダム取得）</span>
        </span>

        <label for="cfgBgInterval">背景の自動切替間隔（分）</label>
        <input type="number" id="cfgBgInterval" min="1" value="10">
      </div>
    </div>
  </section>

  <section class="panel modal-only" id="sectionReminder">
    <h2>
      リマインダーチェック
      <span class="btn-row">
        <button id="btnCheck">リマインド送信チェック</button>
        <button id="btnReset" class="secondary">送信済みフラグをリセット</button>
      </span>
    </h2>
    <div class="panel-body" id="reminderPanelBody">
      <div id="reminderLog"></div>
    </div>
  </section>

  <section class="panel">
    <div id="boardView">
      <div class="kanban-columns" id="kanbanColumns"></div>
    </div>
  </section>

  <section class="panel modal-only" id="sectionContacts">
    <h2>
      名簿
      <span class="btn-row"><button id="btnAddContact" class="secondary small">担当者を追加</button></span>
    </h2>
    <div class="panel-body" id="contactsPanelBody">
      <table style="width:100%; border-collapse:collapse;">
        <thead>
          <tr style="background:#2b3f63; color:#fff; font-size:12px;">
            <th style="text-align:left; padding:6px 8px;">名前</th>
            <th style="text-align:left; padding:6px 8px;">メールアドレス</th>
            <th style="text-align:left; padding:6px 8px;">部署</th>
            <th style="padding:6px 8px;"></th>
          </tr>
        </thead>
        <tbody id="contactBody"></tbody>
      </table>
    </div>
  </section>

</main>


<!-- 各月パネルの「設定/リマインダー/名簿」リンクから開く共有モーダル -->
<!-- 中身は既存パネル（sectionSettings 等）をそのまま移動して表示するため、データや操作は常に1つに共有される -->
<dialog id="panelModal" class="panel-modal">
  <div class="panel-modal-body" id="panelModalBody"></div>
  <div class="panel-modal-footer">
    <button type="button" class="plain small" id="panelModalClose">閉じる</button>
  </div>
</dialog>

<!-- タスク追加ダイアログ -->
<dialog id="taskDialog">
  <form id="taskForm">
    <h3 id="taskDialogTitle">タスク追加</h3>
    <label>タスク名 <input type="text" id="taskName" required></label>
    <label>担当者名（名簿と一致） <input type="text" id="taskAssignee" list="assigneeList"></label>
    <datalist id="assigneeList"></datalist>
    <label>期日（yyyy/mm/dd） <input type="text" id="taskDue" required></label>
    <label>リマインド日数前 <input type="number" id="taskReminderDays" min="0" value="3"></label>
    <div class="dlg-actions">
      <button type="button" class="plain" id="taskCancel">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>

<!-- トースト通知（popover: モーダルダイアログより手前のトップレイヤーに表示される） -->
<div id="toasts" popover="manual"></div>

<!-- 担当者追加ダイアログ -->
<dialog id="contactDialog">
  <form id="contactForm">
    <h3>担当者を追加</h3>
    <label>名前 <input type="text" id="contactName" required></label>
    <label>メールアドレス <input type="text" id="contactEmail" required></label>
    <label>部署 <input type="text" id="contactDept"></label>
    <div class="dlg-actions">
      <button type="button" class="plain" id="contactCancel">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "todoReminder.v1";
  const STATUSES = ["未完了", "進行中", "完了"];

  const defaultState = () => ({
    settings: {
      reminderDays: 3,
      signature: "Todoリマインダーシステム",
      autoMailOn: false,
      boardColorNear: "#2b3f63",
      boardColorFar: "#c4ced0",
      bgOnline: true,
      bgIntervalMin: 10
    },
    tasks: [
      { id: 1, name: "プロジェクト報告書提出", assignee: "山田太郎", due: "2026-07-15", reminderDays: 3, status: "未完了", sentFlag: "" },
      { id: 2, name: "請求書チェック", assignee: "鈴木花子", due: "2026-07-13", reminderDays: 1, status: "進行中", sentFlag: "" }
    ],
    contacts: [
      { name: "山田太郎", email: "yamada@example.com", dept: "営業部" },
      { name: "鈴木花子", email: "suzuki@example.com", dept: "経理部" }
    ],
    nextTaskId: 3,
    monthPos: {}
  });

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      const merged = Object.assign(defaultState(), parsed);
      merged.settings = Object.assign(defaultState().settings, parsed.settings || {});
      return merged;
    } catch (e) {
      console.error("localStorage の読み込みに失敗しました。初期データを使用します。", e);
      return defaultState();
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // ---------------------------------------------------------------
  // 日付ユーティリティ
  // ---------------------------------------------------------------
  function todayDate() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function parseDue(due) {
    if (!due) return null;
    const d = new Date(due + "T00:00:00");
    return isNaN(d.getTime()) ? null : d;
  }
  function daysBetween(today, due) {
    return Math.round((due.getTime() - today.getTime()) / 86400000);
  }
  function formatDate(d) {
    if (!d) return "";
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}/${m}/${day}`;
  }
  function formatDateJP(d) {
    return `${d.getFullYear()}年${String(d.getMonth() + 1).padStart(2, "0")}月${String(d.getDate()).padStart(2, "0")}日`;
  }
  function normalizeDueInput(v) {
    // "yyyy/mm/dd" 等の入力を "yyyy-mm-dd" に正規化
    const m = v.trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if (!m) return null;
    const [, y, mo, da] = m;
    return `${y}-${mo.padStart(2, "0")}-${da.padStart(2, "0")}`;
  }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function monthKeyFromDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; }
  function monthKeyOfTask(task) {
    const d = parseDue(task.due);
    return d ? monthKeyFromDate(d) : "unset";
  }
  function monthLabel(key) {
    if (key === "unset") return "期日未設定";
    const [y, m] = key.split("-").map(Number);
    const now = new Date();
    return (y === now.getFullYear()) ? `${m}月` : `${y}年${m}月`;
  }
  function monthNumberLabel(key) {
    if (key === "unset") return "-";
    return String(Number(key.split("-")[1]));
  }
  // その月のタスク達成率を10%刻み（10段階）に丸めて返す。タスクが無い月は null（達成率表示なし）。
  function monthCompletionStep(tasks) {
    if (tasks.length === 0) return null;
    const done = tasks.filter(t => t.status === "完了").length;
    return Math.round((done / tasks.length) * 10) * 10;
  }
  // その月のタスク達成率（%、整数）。タスクが無い月は null。
  function monthCompletionPercent(tasks) {
    if (tasks.length === 0) return null;
    const done = tasks.filter(t => t.status === "完了").length;
    return Math.round((done / tasks.length) * 100);
  }
  function hexToRgb(hex) {
    const n = parseInt(hex.replace("#", ""), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbToHex(rgb) {
    return "#" + rgb.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
  }
  // 現在月に近いほど濃く、遠いほど薄い見出し色を返す（期日未設定は最も薄い扱い）。近い/遠い色は設定でカスタマイズ可能。
  // 個別の月に色が指定されている場合（state.monthPos[key].color）は、そちらを優先する。
  function autoMonthColor(key, nowKey) {
    const dark = hexToRgb(state.settings.boardColorNear);
    const light = hexToRgb(state.settings.boardColorFar);
    let t = 1;
    if (key !== "unset") {
      const [y, m] = key.split("-").map(Number);
      const [ny, nm] = nowKey.split("-").map(Number);
      const dist = Math.abs((y - ny) * 12 + (m - nm));
      t = Math.min(1, dist / 11);
    }
    const rgb = dark.map((d, i) => Math.round(d + (light[i] - d) * t));
    return rgbToHex(rgb);
  }
  function monthHeaderColor(key, nowKey) {
    const custom = state.monthPos[key] && state.monthPos[key].color;
    const hex = custom || autoMonthColor(key, nowKey);
    const rgb = hexToRgb(hex);
    const brightness = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000;
    return { bg: hex, fg: brightness > 150 ? "#1f2937" : "#ffffff" };
  }
  function getMonthKeys() {
    // インターフェースは常に「今年の1月〜12月」の固定カレンダー年のみを表示する
    const year = new Date().getFullYear();
    const hasUnset = state.tasks.some(t => monthKeyOfTask(t) === "unset");
    const result = [];
    for (let m = 1; m <= 12; m++) result.push(`${year}-${pad2(m)}`);
    if (hasUnset) result.push("unset");
    return result;
  }

  // ---------------------------------------------------------------
  // 共有モーダル（各月パネルの「設定/リマインダー/名簿」リンクから開く）
  // 設定・リマインダーチェック・名簿は画面には常に非表示（.modal-only）で、
  // このモーダルへ既存パネル要素をそのまま移動して表示する（複製ではなく常にデータ・操作を共有）。
  // ---------------------------------------------------------------
  const PANEL_SECTION_IDS = {
    settings: "sectionSettings",
    reminder: "sectionReminder",
    contacts: "sectionContacts"
  };
  const panelModal = document.getElementById("panelModal");
  const panelModalBody = document.getElementById("panelModalBody");
  let modalReturn = null;

  function openPanelModal(key) {
    const el = document.getElementById(PANEL_SECTION_IDS[key]);
    modalReturn = { el, parent: el.parentElement, nextSibling: el.nextSibling };
    panelModalBody.appendChild(el);
    panelModal.showModal();
  }

  document.getElementById("panelModalClose").addEventListener("click", () => panelModal.close());
  panelModal.addEventListener("close", () => {
    if (!modalReturn) return;
    const { el, parent, nextSibling } = modalReturn;
    if (nextSibling) parent.insertBefore(el, nextSibling); else parent.appendChild(el);
    modalReturn = null;
  });

  // ---------------------------------------------------------------
  // 設定パネル
  // ---------------------------------------------------------------
  const cfgReminderDays = document.getElementById("cfgReminderDays");
  const cfgSignature = document.getElementById("cfgSignature");
  const cfgAutoMail = document.getElementById("cfgAutoMail");
  const cfgAutoMailLabel = document.getElementById("cfgAutoMailLabel");
  const cfgColorNear = document.getElementById("cfgColorNear");
  const cfgColorFar = document.getElementById("cfgColorFar");
  const cfgBgOnline = document.getElementById("cfgBgOnline");
  const cfgBgOnlineLabel = document.getElementById("cfgBgOnlineLabel");
  const cfgBgInterval = document.getElementById("cfgBgInterval");

  function renderSettings() {
    cfgReminderDays.value = state.settings.reminderDays;
    cfgSignature.value = state.settings.signature;
    cfgAutoMail.checked = state.settings.autoMailOn;
    cfgAutoMailLabel.textContent = state.settings.autoMailOn
      ? "ON（ブラウザ版は実送信できないためドライランのまま判定のみ行います）"
      : "OFF（ブラウザ版は常にドライラン）";
    cfgColorNear.value = state.settings.boardColorNear;
    cfgColorFar.value = state.settings.boardColorFar;
    cfgBgOnline.checked = state.settings.bgOnline;
    cfgBgOnlineLabel.textContent = state.settings.bgOnline
      ? "ON（ネットからランダム取得）"
      : "OFF（グラデーション背景）";
    cfgBgInterval.value = state.settings.bgIntervalMin;
  }
  cfgReminderDays.addEventListener("change", () => {
    state.settings.reminderDays = Math.max(0, parseInt(cfgReminderDays.value, 10) || 0);
    save();
  });
  cfgSignature.addEventListener("change", () => {
    state.settings.signature = cfgSignature.value.trim() || "Todoリマインダーシステム";
    save();
  });
  cfgAutoMail.addEventListener("change", () => {
    state.settings.autoMailOn = cfgAutoMail.checked;
    renderSettings();
    save();
  });
  cfgColorNear.addEventListener("input", () => {
    state.settings.boardColorNear = cfgColorNear.value;
    save();
    renderBoard();
  });
  cfgColorFar.addEventListener("input", () => {
    state.settings.boardColorFar = cfgColorFar.value;
    save();
    renderBoard();
  });
  cfgBgOnline.addEventListener("change", () => {
    state.settings.bgOnline = cfgBgOnline.checked;
    renderSettings();
    save();
    changeBackground(false);
    restartBgTimer();
  });
  cfgBgInterval.addEventListener("change", () => {
    state.settings.bgIntervalMin = Math.max(1, parseInt(cfgBgInterval.value, 10) || 10);
    renderSettings();
    save();
    restartBgTimer();
  });

  // ---------------------------------------------------------------
  // リマインダーチェック（ドライラン。spec.md 4章のロジックを踏襲）
  // ---------------------------------------------------------------
  const reminderLog = document.getElementById("reminderLog");

  function getEmailByName(name) {
    const c = state.contacts.find(c => c.name.trim() === (name || "").trim());
    return c ? c.email.trim() : "";
  }

  function checkAndSendReminders() {
    const today = todayDate();
    let sentCount = 0, skipCount = 0;
    const lines = [];

    for (const task of state.tasks) {
      if (task.status === "完了") continue;
      if (task.sentFlag === "済") { skipCount++; continue; }

      const due = parseDue(task.due);
      if (!due) continue;

      const reminderDays = task.reminderDays > 0 ? task.reminderDays : state.settings.reminderDays;
      const daysLeft = daysBetween(today, due);

      if (daysLeft < 0) {
        task.sentFlag = "期日超過";
        lines.push(`[期日超過] ${task.name}（担当: ${task.assignee} / 期日: ${formatDate(due)}）`);
      } else if (daysLeft <= reminderDays) {
        const email = getEmailByName(task.assignee);
        if (email) {
          const subject = `【リマインド】${task.name}（期日：${formatDate(due)}）`;
          const bodyIntro = daysLeft === 0
            ? "本日が期日のタスクがあります。ご確認をお願いいたします。"
            : `期日まで残り ${daysLeft} 日となりました。ご対応をお願いいたします。`;
          const body = `${task.assignee} 様\n\n${bodyIntro}\n\n` +
            `━━━━━━━━━━━━━━━━━━━━━━━━\n` +
            `  タスク名：${task.name}\n` +
            `  期　　日：${formatDateJP(due)}\n` +
            `  残り日数：${daysLeft} 日\n` +
            `━━━━━━━━━━━━━━━━━━━━━━━━\n\n` +
            `このメールは${state.settings.signature}より自動送信されています。`;
          task.sentFlag = "済";
          sentCount++;
          lines.push(`[送信対象] To: ${email}\n件名: ${subject}\n${body}`);
        } else {
          task.sentFlag = "アドレス不明";
          lines.push(`[アドレス不明] ${task.name}（担当: ${task.assignee}）`);
        }
      }
    }

    save();
    renderBoard();

    let msg;
    if (sentCount > 0) {
      msg = `${sentCount} 件のリマインド対象を検出しました。\n（送信済みスキップ: ${skipCount} 件）\n※ブラウザ版は実際のメール送信を行いません（プレビューのみ）。\n\n`;
    } else {
      msg = `送信対象のタスクはありませんでした。\n（スキップ済: ${skipCount} 件）\n\n`;
    }
    reminderLog.textContent = msg + (lines.length ? lines.join("\n\n") : "");
    toast(sentCount > 0
      ? `${sentCount} 件のリマインド対象を検出しました`
      : "送信対象のタスクはありませんでした");
  }

  function resetSentFlags() {
    if (!confirm("送信済みフラグを全てリセットしますか？\n（「済」「アドレス不明」「期日超過」を全て空白に戻します）")) return;
    for (const task of state.tasks) task.sentFlag = "";
    save();
    renderBoard();
    reminderLog.textContent = "";
  }

  document.getElementById("btnCheck").addEventListener("click", checkAndSendReminders);
  document.getElementById("btnReset").addEventListener("click", resetSentFlags);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------------------------------------------------------------
  // 月別ボード（期日の月ごとにパネルを分割）
  // ---------------------------------------------------------------
  // カードは既定では タスク名/期日/達成状況 の3項目のみを表示する簡易表示。
  // クリックした（選択した）カードだけ、担当者・期日・ステータス・リマインド日数前・送信済み状況の詳細を展開する。
  const FONT_SIZE_SCALE = { small: 0.85, normal: 1, large: 1.25 };
  const SHADOW_PRESET = { none: "", normal: "0 2px 6px rgba(0,0,0,0.15)", strong: "0 8px 20px rgba(0,0,0,0.35)" };
  const TILE_SIZE_PRESET = {
    small: { tile: 32, badge: 22, font: 11 },
    normal: { tile: 44, badge: 30, font: 14 },
    large: { tile: 60, badge: 42, font: 18 }
  };
  const ICON_OPTIONS = [["", "なし"], ["📌", "📌"], ["⭐", "⭐"], ["🔥", "🔥"], ["📅", "📅"]];
  let selectedTaskId = null;
  let openMenuMonthKey = null;
  let searchQuery = "";
  let zCounter = state.tasks.reduce((max, t) => Math.max(max, t.z || 0), 0);
  let colZCounter = Object.values(state.monthPos).reduce((max, p) => Math.max(max, p.z || 0), 0);
  const kanbanColumns = document.getElementById("kanbanColumns");
  document.addEventListener("click", () => {
    if (openMenuMonthKey !== null) {
      openMenuMonthKey = null;
      renderBoard();
    }
  });

  // ボード背景の空きスペースをドラッグして、スクロールバーを出さずにパン移動する（カード/パネル自体のドラッグとは競合しないよう対象要素を限定）。
  const boardView = document.getElementById("boardView");
  boardView.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    if (e.target !== boardView && e.target !== kanbanColumns) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const startScrollLeft = boardView.scrollLeft, startScrollTop = boardView.scrollTop;
    boardView.classList.add("panning");

    function onMove(ev) {
      boardView.scrollLeft = startScrollLeft - (ev.clientX - startX);
      boardView.scrollTop = startScrollTop - (ev.clientY - startY);
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      boardView.classList.remove("panning");
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });

  function clampPos(wrap, x, y) {
    const cardW = 128, cardH = 70;
    const w = Math.max(wrap.clientWidth, cardW + 8);
    const h = Math.max(wrap.clientHeight, cardH + 8);
    return {
      x: Math.max(4, Math.min(x, w - cardW - 4)),
      y: Math.max(4, Math.min(y, h - cardH - 4))
    };
  }

  function ensureDefaultPos(tasks) {
    let assigned = false;
    tasks.forEach((t, i) => {
      if (!t.pos) {
        assigned = true;
        t.pos = { x: 6, y: 6 + i * 64 };
      }
    });
    return assigned;
  }

  // 月パネルの既定配置（未配置のキーにのみ、簡単なグリッド状の初期位置を割り当てる）。既定では折りたたみ状態（月名のみ）。
  function ensureColPos(keys) {
    let assigned = false;
    const perRow = 4, colW = 260, rowH = 320;
    keys.forEach((key, i) => {
      if (!state.monthPos[key]) {
        assigned = true;
        state.monthPos[key] = { x: (i % perRow) * colW, y: Math.floor(i / perRow) * rowH, z: 0, collapsed: true };
      }
    });
    return assigned;
  }

  // 月パネル同士が自由配置後にどこまで広がっても収まるよう、キャンバスのサイズを実測して合わせる
  function resizeBoardCanvas() {
    let maxRight = 0, maxBottom = 0;
    kanbanColumns.querySelectorAll(".kb-col").forEach(col => {
      maxRight = Math.max(maxRight, col.offsetLeft + col.offsetWidth);
      maxBottom = Math.max(maxBottom, col.offsetTop + col.offsetHeight);
    });
    kanbanColumns.style.width = (maxRight + 20) + "px";
    kanbanColumns.style.height = (maxBottom + 20) + "px";
  }

  // 月パネル自体のドラッグ移動（見出し部分をつかんで画面中の好きな位置へ）。
  // 見出しのクリック（＝移動しなかった場合）は折りたたみ⇔展開の切り替えになる。
  function attachColDrag(col, key) {
    const hdr = col.querySelector(".kb-col-hdr");
    let suppressClick = false;

    hdr.addEventListener("mousedown", e => {
      if (e.button !== 0) return;
      e.preventDefault();

      state.monthPos[key].z = ++colZCounter;
      col.style.zIndex = state.monthPos[key].z;
      save();

      const startX = e.clientX, startY = e.clientY;
      const containerRect = kanbanColumns.getBoundingClientRect();
      const colRect = col.getBoundingClientRect();
      const offsetX = startX - colRect.left;
      const offsetY = startY - colRect.top;
      let moved = false;

      function onMove(ev) {
        if (!moved && (Math.abs(ev.clientX - startX) > 3 || Math.abs(ev.clientY - startY) > 3)) {
          moved = true;
          col.classList.add("dragging-col");
        }
        if (!moved) return;
        const x = Math.max(0, ev.clientX - containerRect.left - offsetX);
        const y = Math.max(0, ev.clientY - containerRect.top - offsetY);
        col.style.left = x + "px";
        col.style.top = y + "px";
        resizeBoardCanvas();
      }
      function onUp() {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        if (!moved) return;
        suppressClick = true;
        col.classList.remove("dragging-col");
        state.monthPos[key].x = parseFloat(col.style.left);
        state.monthPos[key].y = parseFloat(col.style.top);
        save();
        resizeBoardCanvas();
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });

    hdr.addEventListener("click", () => {
      if (suppressClick) { suppressClick = false; return; }
      state.monthPos[key].collapsed = !state.monthPos[key].collapsed;
      save();
      renderBoard();
    });
  }

  const COL_MIN_W = 90, COL_HEADER_H = 34, COL_MIN_H = COL_HEADER_H;

  // 月パネル右下のハンドルをドラッグして大きさを自由に変更する。
  // 見出しの高さまで縮めると、折りたたみ状態（月名のみ表示）に切り替わる。
  function attachColResize(col, key) {
    const handle = document.createElement("div");
    handle.className = "kb-col-resize";
    handle.addEventListener("mousedown", e => {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const startX = e.clientX, startY = e.clientY;
      const startW = col.offsetWidth, startH = col.offsetHeight;
      let requestedW = startW, requestedH = startH;

      function onMove(ev) {
        requestedW = Math.max(COL_MIN_W, startW + (ev.clientX - startX));
        requestedH = Math.max(COL_MIN_H, startH + (ev.clientY - startY));
        col.style.width = requestedW + "px";
        col.style.height = requestedH + "px";
        resizeBoardCanvas();
      }
      function onUp() {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        // flexboxの子要素は内容サイズより縮まないため、実測値ではなく要求値で折りたたみ判定する
        const isMin = requestedH <= COL_HEADER_H + 6;
        state.monthPos[key].w = requestedW;
        if (!isMin) state.monthPos[key].h = requestedH;
        state.monthPos[key].collapsed = isMin;
        save();
        renderBoard();
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
    col.appendChild(handle);
  }

  function attachCardDrag(card, task) {
    card.addEventListener("mousedown", e => {
      if (e.button !== 0) return;
      if (e.target.closest("[data-detail]")) return;
      e.preventDefault();

      // 重なったカードをクリック/ドラッグしたときに最前面へ出す
      task.z = ++zCounter;
      card.style.zIndex = (task.id === selectedTaskId ? 1000 : 0) + task.z;
      save();

      const startX = e.clientX, startY = e.clientY;
      const originWrap = card.parentElement;
      const cardRect = card.getBoundingClientRect();
      const offsetX = startX - cardRect.left;
      const offsetY = startY - cardRect.top;
      let moved = false;

      function onMove(ev) {
        if (!moved && (Math.abs(ev.clientX - startX) > 3 || Math.abs(ev.clientY - startY) > 3)) {
          moved = true;
          card.classList.add("dragging");
        }
        if (!moved) return;
        card.style.position = "fixed";
        card.style.left = (ev.clientX - offsetX) + "px";
        card.style.top = (ev.clientY - offsetY) + "px";
        card.style.zIndex = 99999;
        document.querySelectorAll(".kb-col.drop-target").forEach(c => c.classList.remove("drop-target"));
        const under = document.elementFromPoint(ev.clientX, ev.clientY);
        const col = under && under.closest(".kb-col");
        if (col) col.classList.add("drop-target");
      }

      function onUp(ev) {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        document.querySelectorAll(".kb-col.drop-target").forEach(c => c.classList.remove("drop-target"));
        if (!moved) return;
        card.classList.remove("dragging");
        card.style.position = "";
        card.style.left = "";
        card.style.top = "";

        const under = document.elementFromPoint(ev.clientX, ev.clientY);
        const targetCol = under && under.closest(".kb-col");
        const targetWrap = targetCol ? targetCol.querySelector(".kb-cards") : originWrap;
        const wrapRect = targetWrap.getBoundingClientRect();
        task.pos = clampPos(targetWrap, ev.clientX - wrapRect.left - offsetX, ev.clientY - wrapRect.top - offsetY);

        if (targetCol && targetCol.dataset.month !== monthKeyOfTask(task)) {
          moveTaskToMonth(task.id, targetCol.dataset.month);
        } else {
          save();
          renderBoard();
        }
      }

      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  }

  function buildCardEl(task) {
    const due = parseDue(task.due);
    const expanded = task.id === selectedTaskId;
    // 検索クエリに一致しないカードは薄く表示する（一致カードだけが浮かび上がる）
    const matches = !searchQuery
      || task.name.toLowerCase().includes(searchQuery)
      || (task.assignee || "").toLowerCase().includes(searchQuery);
    const card = document.createElement("div");
    card.className = `kb-card status-${task.status}` + (expanded ? " selected" : "") + (matches ? "" : " dimmed");
    card.dataset.taskId = task.id;
    card.style.left = task.pos.x + "px";
    card.style.top = task.pos.y + "px";
    card.style.zIndex = (expanded ? 1000 : 0) + (task.z || 0);
    card.innerHTML = `
      <div class="t-name">${escapeHtml(task.name)}</div>
      <div class="t-meta">
        <span>${due ? formatDate(due) : escapeHtml(task.due || "未設定")}</span>
        <span class="status-badge status-${task.status}">${task.status}</span>
      </div>
      ${expanded ? `
      <div class="t-detail" data-detail>
        <label>担当者
          <input type="text" class="edit-assignee" value="${escapeHtml(task.assignee)}" list="assigneeList">
        </label>
        <label>期日（yyyy/mm/dd）
          <input type="text" class="edit-due" value="${due ? formatDate(due) : escapeHtml(task.due || "")}">
        </label>
        <label>ステータス
          <select class="edit-status">
            ${STATUSES.map(s => `<option value="${s}" ${s === task.status ? "selected" : ""}>${s}</option>`).join("")}
          </select>
        </label>
        <span>リマインド日数前: ${task.reminderDays}</span>
        <span>送信済み: ${task.sentFlag ? escapeHtml(task.sentFlag) : "（未判定）"}</span>
        <button type="button" class="danger small edit-delete">タスクを削除</button>
      </div>` : ""}
    `;
    card.addEventListener("click", e => {
      if (e.target.closest("[data-detail]")) return;
      selectedTaskId = expanded ? null : task.id;
      renderBoard();
    });
    attachCardDrag(card, task);
    if (expanded) {
      card.querySelector(".edit-assignee").addEventListener("change", e => {
        task.assignee = e.target.value.trim();
        save();
        renderBoard();
      });
      card.querySelector(".edit-due").addEventListener("change", e => {
        const normalized = normalizeDueInput(e.target.value);
        if (!normalized) { alert("期日は yyyy/mm/dd 形式で入力してください。"); renderBoard(); return; }
        task.due = normalized;
        task.sentFlag = "";
        save();
        renderBoard();
      });
      card.querySelector(".edit-status").addEventListener("change", e => {
        task.status = e.target.value;
        task.sentFlag = "";
        save();
        renderBoard();
      });
      // 削除は即時反映しつつ、トーストの「元に戻す」で復元できる（確認ダイアログで操作を止めない）
      card.querySelector(".edit-delete").addEventListener("click", () => {
        const index = state.tasks.indexOf(task);
        state.tasks.splice(index, 1);
        selectedTaskId = null;
        save();
        renderBoard();
        toast(`「${task.name}」を削除しました`, {
          actionLabel: "元に戻す",
          onAction: () => {
            state.tasks.splice(Math.min(index, state.tasks.length), 0, task);
            save();
            renderBoard();
          }
        });
      });
    }
    return card;
  }

  function renderBoard() {
    kanbanColumns.innerHTML = "";
    const nowKey = monthKeyFromDate(new Date());
    const monthKeys = getMonthKeys();
    let needsSave = ensureColPos(monthKeys);
    for (const key of monthKeys) {
      const pos = state.monthPos[key];
      const collapsed = !!pos.collapsed;
      const tileSize = TILE_SIZE_PRESET[pos.tileSize || "normal"];
      const col = document.createElement("div");
      col.className = "kb-col" + (key === nowKey ? " current-month" : "") + (collapsed ? " collapsed" : "");
      col.dataset.month = key;
      col.style.left = pos.x + "px";
      col.style.top = pos.y + "px";
      col.style.zIndex = pos.z || 0;
      col.style.width = collapsed ? tileSize.tile + "px" : (pos.w || 240) + "px";
      if (!collapsed && pos.h) col.style.height = pos.h + "px";
      col.style.borderStyle = pos.border === "double" ? "double" : "";
      col.style.borderWidth = pos.border === "double" ? "4px" : "";
      col.style.setProperty("--kb-font-scale", FONT_SIZE_SCALE[pos.fontSize || "normal"]);
      const ringShadow = key === nowKey ? "0 0 0 2px #ff8c00" : "";
      const shadowPreset = SHADOW_PRESET[pos.shadow || "none"];
      col.style.boxShadow = [ringShadow, shadowPreset].filter(Boolean).join(", ");

      const tasks = state.tasks.filter(t => monthKeyOfTask(t) === key);

      const hdr = document.createElement("div");
      hdr.className = "kb-col-hdr" + (collapsed ? " kb-col-hdr-collapsed" : "");
      if (collapsed && pos.shape === "circle") {
        col.style.borderRadius = "50%";
        hdr.style.borderRadius = "50%";
      } else {
        col.style.borderRadius = "";
        hdr.style.borderRadius = "";
      }
      const { bg, fg } = monthHeaderColor(key, nowKey);
      hdr.style.color = fg;
      hdr.style.background = bg;
      // 折りたたみタイルの外枠を、達成率10段階ぶん時計回りに描く進捗リングにする（padding分の隙間にcolの背景=conic-gradientを覗かせる）。
      const completionStep = collapsed ? monthCompletionStep(tasks) : null;
      if (completionStep !== null) {
        const angle = completionStep * 3.6;
        col.style.padding = "3px";
        col.style.background = `conic-gradient(var(--green) 0deg ${angle}deg, var(--border) ${angle}deg 360deg)`;
        col.title = `達成率: ${completionStep}%`;
      } else {
        col.style.padding = "";
        col.style.background = "";
        col.title = "";
      }

      if (collapsed) {
        const monthBadge = document.createElement("span");
        monthBadge.className = "kb-col-count kb-col-count-lg";
        monthBadge.textContent = monthNumberLabel(key);
        monthBadge.style.width = tileSize.badge + "px";
        monthBadge.style.height = tileSize.badge + "px";
        monthBadge.style.fontSize = tileSize.font + "px";
        hdr.appendChild(monthBadge);
        if (pos.icon) {
          const iconSpan = document.createElement("span");
          iconSpan.className = "kb-col-tile-icon";
          iconSpan.textContent = pos.icon;
          col.appendChild(iconSpan);
        }
      } else {
        const hdrLabel = document.createElement("span");
        hdrLabel.className = "kb-col-hdr-label";
        hdrLabel.textContent = (pos.icon ? pos.icon + " " : "") + "▼ " + monthLabel(key) + (key === nowKey ? "（今月）" : "");
        hdr.appendChild(hdrLabel);
        const pct = monthCompletionPercent(tasks);
        if (pct !== null) {
          const pctBadge = document.createElement("span");
          pctBadge.className = "kb-col-pct-badge";
          pctBadge.textContent = pct + "%";
          hdr.appendChild(pctBadge);
        }
        const menuBtn = document.createElement("button");
        menuBtn.type = "button";
        menuBtn.className = "kb-col-menu-btn";
        menuBtn.textContent = "☰";
        menuBtn.title = "メニュー";
        menuBtn.addEventListener("mousedown", e => e.stopPropagation());
        menuBtn.addEventListener("click", e => {
          e.stopPropagation();
          openMenuMonthKey = (openMenuMonthKey === key) ? null : key;
          renderBoard();
        });
        hdr.appendChild(menuBtn);
      }
      col.appendChild(hdr);
      attachColDrag(col, key);

      if (!collapsed) {
        const cardsWrap = document.createElement("div");
        cardsWrap.className = "kb-cards";
        // 空きスペースをダブルクリックすると、その月のタスク追加ダイアログを開く
        cardsWrap.addEventListener("dblclick", e => {
          if (e.target !== cardsWrap && !e.target.classList.contains("empty-msg")) return;
          openTaskDialog({ monthKey: key });
        });
        if (tasks.length === 0) {
          cardsWrap.innerHTML = `<div class="empty-msg">タスクなし</div>`;
        } else {
          if (ensureDefaultPos(tasks)) needsSave = true;
          if (!pos.h) {
            const maxY = Math.max(...tasks.map(t => t.pos.y + 90));
            cardsWrap.style.minHeight = Math.max(220, maxY) + "px";
          }
          for (const task of tasks) cardsWrap.appendChild(buildCardEl(task));
        }
        col.appendChild(cardsWrap);

        if (openMenuMonthKey === key) {
          const menu = document.createElement("div");
          menu.className = "kb-col-menu";
          menu.addEventListener("click", e => e.stopPropagation());
          menu.addEventListener("mousedown", e => e.stopPropagation());

          const addBtn = document.createElement("button");
          addBtn.type = "button";
          addBtn.className = "kb-col-menu-item";
          addBtn.textContent = "+ タスク追加";
          addBtn.addEventListener("click", () => {
            openMenuMonthKey = null;
            renderBoard();
            openTaskDialog({ monthKey: key });
          });
          menu.appendChild(addBtn);

          [["settings", "設定"], ["reminder", "リマインダー"], ["contacts", "名簿"]].forEach(([panelKey, label]) => {
            const item = document.createElement("button");
            item.type = "button";
            item.className = "kb-col-menu-item";
            item.textContent = label;
            item.addEventListener("click", () => {
              openMenuMonthKey = null;
              renderBoard();
              openPanelModal(panelKey);
            });
            menu.appendChild(item);
          });

          const buildSelectRow = (labelText, options, currentValue, onPick) => {
            const row = document.createElement("label");
            row.className = "kb-col-menu-field-row";
            row.textContent = labelText;
            const select = document.createElement("select");
            options.forEach(([val, optLabel]) => {
              const opt = document.createElement("option");
              opt.value = val;
              opt.textContent = optLabel;
              if (currentValue === val) opt.selected = true;
              select.appendChild(opt);
            });
            select.addEventListener("change", () => {
              onPick(select.value);
              save();
              renderBoard();
            });
            row.appendChild(select);
            return row;
          };

          const colorRow = document.createElement("label");
          colorRow.className = "kb-col-menu-field-row";
          colorRow.textContent = "色";
          const colorInput = document.createElement("input");
          colorInput.type = "color";
          colorInput.value = bg;
          colorInput.addEventListener("change", () => {
            state.monthPos[key].color = colorInput.value;
            save();
            renderBoard();
          });
          colorRow.appendChild(colorInput);
          menu.appendChild(colorRow);

          menu.appendChild(buildSelectRow("形（折りたたみ時）", [["square", "四角"], ["circle", "〇"]],
            pos.shape || "square", v => { state.monthPos[key].shape = v; }));

          menu.appendChild(buildSelectRow("枠線", [["normal", "通常"], ["double", "二重"]],
            pos.border || "normal", v => { state.monthPos[key].border = v; }));

          menu.appendChild(buildSelectRow("文字サイズ", [["small", "小"], ["normal", "標準"], ["large", "大"]],
            pos.fontSize || "normal", v => { state.monthPos[key].fontSize = v; }));

          menu.appendChild(buildSelectRow("影の強さ", [["none", "なし"], ["normal", "標準"], ["strong", "強"]],
            pos.shadow || "none", v => { state.monthPos[key].shadow = v; }));

          menu.appendChild(buildSelectRow("折りたたみの大きさ", [["small", "小"], ["normal", "標準"], ["large", "大"]],
            pos.tileSize || "normal", v => { state.monthPos[key].tileSize = v; }));

          menu.appendChild(buildSelectRow("アイコン", ICON_OPTIONS,
            pos.icon || "", v => { state.monthPos[key].icon = v; }));

          col.appendChild(menu);
        }

        attachColResize(col, key);
      }

      kanbanColumns.appendChild(col);
    }
    if (needsSave) save();
    resizeBoardCanvas();
  }

  function moveTaskToMonth(taskId, monthKey) {
    const task = state.tasks.find(t => t.id === taskId);
    if (!task || monthKeyOfTask(task) === monthKey) return;
    if (monthKey === "unset") {
      task.due = "";
    } else {
      const [y, m] = monthKey.split("-").map(Number);
      const oldDue = parseDue(task.due);
      const day = oldDue ? oldDue.getDate() : 15;
      const lastDay = new Date(y, m, 0).getDate();
      task.due = `${y}-${pad2(m)}-${pad2(Math.min(day, lastDay))}`;
    }
    task.sentFlag = ""; // spec.md 5.4: 移動のたびに送信済みフラグはリセットされる
    save();
    renderBoard();
  }

  // ---- タスク追加ダイアログ ----
  const taskDialog = document.getElementById("taskDialog");
  const taskForm = document.getElementById("taskForm");
  const taskName = document.getElementById("taskName");
  const taskAssignee = document.getElementById("taskAssignee");
  const taskDue = document.getElementById("taskDue");
  const taskReminderDays = document.getElementById("taskReminderDays");
  const assigneeList = document.getElementById("assigneeList");

  function openTaskDialog({ monthKey }) {
    taskForm.reset();
    taskName.value = "";
    taskAssignee.value = "";
    let d;
    if (monthKey && monthKey !== "unset") {
      const [y, m] = monthKey.split("-").map(Number);
      d = new Date(y, m - 1, 15);
    } else {
      d = new Date();
      d.setDate(d.getDate() + 7);
    }
    taskDue.value = formatDate(d);
    taskReminderDays.value = 3;
    assigneeList.innerHTML = state.contacts.map(c => `<option value="${escapeHtml(c.name)}">`).join("");
    document.getElementById("taskDialogTitle").textContent = `タスク追加（${monthLabel(monthKey || monthKeyFromDate(new Date()))}）`;
    taskDialog.showModal();
  }

  document.getElementById("taskCancel").addEventListener("click", () => taskDialog.close());

  taskForm.addEventListener("submit", e => {
    e.preventDefault();
    const due = normalizeDueInput(taskDue.value);
    if (!due) { alert("期日は yyyy/mm/dd 形式で入力してください。"); return; }
    const newTask = {
      id: state.nextTaskId++,
      name: taskName.value.trim(),
      assignee: taskAssignee.value.trim(),
      due,
      reminderDays: Math.max(0, parseInt(taskReminderDays.value, 10) || 0),
      status: "未完了",
      sentFlag: ""
    };
    state.tasks.push(newTask);
    save();
    taskDialog.close();
    renderBoard();
    toast(`「${newTask.name}」を追加しました`);
  });

  // ---------------------------------------------------------------
  // トースト通知（右下にスライドイン。「元に戻す」などのアクション付きにも対応）
  // ---------------------------------------------------------------
  const toastsEl = document.getElementById("toasts");
  function toast(message, opts = {}) {
    // popoverとして再表示することで、開いているモーダルダイアログよりも手前（トップレイヤー最上位）に出す
    if (toastsEl.showPopover) {
      try { toastsEl.hidePopover(); } catch (e) { /* 未表示なら無視 */ }
      try { toastsEl.showPopover(); } catch (e) { /* 非対応ブラウザは通常表示 */ }
    }
    const el = document.createElement("div");
    el.className = "toast";
    const span = document.createElement("span");
    span.textContent = message;
    el.appendChild(span);
    let dismissed = false;
    function dismiss() {
      if (dismissed) return;
      dismissed = true;
      el.classList.add("hide");
      setTimeout(() => el.remove(), 300);
    }
    if (opts.actionLabel && opts.onAction) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = opts.actionLabel;
      btn.addEventListener("click", () => { opts.onAction(); dismiss(); });
      el.appendChild(btn);
    }
    toastsEl.appendChild(el);
    setTimeout(dismiss, opts.duration || 4500);
  }

  // ---------------------------------------------------------------
  // 背景：ネットからランダム画像を取得し、2枚のレイヤーでクロスフェード切替。
  // 設定した間隔で自動ローテーションし、取得失敗・オフライン時はグラデーションにフォールバックする。
  // ---------------------------------------------------------------
  const FALLBACK_GRADIENTS = [
    "linear-gradient(135deg, #f6d365, #fda085)",
    "linear-gradient(135deg, #a1c4fd, #c2e9fb)",
    "linear-gradient(135deg, #d4fc79, #96e6a1)",
    "linear-gradient(135deg, #fbc2eb, #a6c1ee)",
    "linear-gradient(135deg, #fddb92, #d1fdff)",
    "linear-gradient(135deg, #cfd9df, #e2ebf0)",
    "linear-gradient(135deg, #ffecd2, #fcb69f)",
    "linear-gradient(135deg, #a8edea, #fed6e3)",
    "linear-gradient(135deg, #d299c2, #fef9d7)",
    "linear-gradient(135deg, #89f7fe, #66a6ff)"
  ];
  const bgLayers = [document.getElementById("bgA"), document.getElementById("bgB")];
  let bgActive = 0;
  let bgTimer = null;

  function swapBgLayers(image) {
    const next = bgActive ^ 1;
    bgLayers[next].style.backgroundImage = image;
    bgLayers[bgActive].classList.remove("visible");
    bgLayers[next].classList.add("visible");
    bgActive = next;
  }

  function showGradientBackground() {
    swapBgLayers(FALLBACK_GRADIENTS[Math.floor(Math.random() * FALLBACK_GRADIENTS.length)]);
  }

  function changeBackground(notify) {
    if (!state.settings.bgOnline) {
      showGradientBackground();
      if (notify) toast("背景を変更しました（グラデーション）");
      return;
    }
    // picsum.photos: APIキー不要のランダム写真。seedを毎回変えて重複を避け、読み込み完了後にフェードインする。
    const seed = Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
    const url = `https://picsum.photos/seed/${seed}/1920/1080`;
    const img = new Image();
    img.onload = () => {
      swapBgLayers(`url("${url}")`);
      if (notify) toast("背景を変更しました");
    };
    img.onerror = () => {
      showGradientBackground();
      if (notify) toast("画像を取得できないため、グラデーション背景を使用します");
    };
    img.src = url;
  }

  function restartBgTimer() {
    if (bgTimer) clearInterval(bgTimer);
    const min = Math.max(1, state.settings.bgIntervalMin || 10);
    bgTimer = setInterval(() => changeBackground(false), min * 60000);
  }

    openTaskDialog({ monthKey: monthKeyFromDate(new Date()) });

  document.getElementById("btnBgChange").addEventListener("click", () => changeBackground(true));

  document.getElementById("btnOpenContacts").addEventListener("click", () => openPanelModal("contacts"));

  // N: タスク追加 / B: 背景変更 / "/": 検索へフォーカス / Esc: 検索クリア・選択解除・メニューを閉じる
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const anyDialogOpen = !!document.querySelector("dialog[open]");
    if (e.key === "Escape" && !anyDialogOpen) {
      if (document.activeElement === searchInput && searchInput.value) {
        searchInput.value = "";
        searchQuery = "";
        searchInput.blur();
        renderBoard();
      } else if (selectedTaskId !== null) {
        selectedTaskId = null;
        renderBoard();
      } else if (openMenuMonthKey !== null) {
        openMenuMonthKey = null;
        renderBoard();
      }
      return;
    }
    const tag = document.activeElement && document.activeElement.tagName;
    const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
    if (typing || anyDialogOpen) return;
    if (e.key === "n" || e.key === "N") {
      e.preventDefault();
      openTaskDialog({ monthKey: monthKeyFromDate(new Date()) });
    } else if (e.key === "b" || e.key === "B") {
      e.preventDefault();
      changeBackground(true);
    } else if (e.key === "/") {
      e.preventDefault();
      searchInput.focus();
    }
  });

  function renderAll() {
    changeBackground(false);
    restartBgTimer();
    renderSettings();
    renderContacts();
    renderBoard();
    reminderLog.textContent = "";
  }

  renderAll();
})();
</script>
</body>
</html>
