

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todoリマインダー（ブラウザ版）</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #3b82f6;
    --orange: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --bg: #e8edf5;
    --panel: rgba(255, 255, 255, 0.68);
    --panel-solid: #ffffff;
    --border: rgba(15, 23, 42, 0.12);
    --text: #0f172a;
    --muted: #5b6472;
    --accent: #2563eb;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 2px 10px rgba(15, 23, 42, 0.07);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.10), 0 12px 32px rgba(15, 23, 42, 0.14);
    --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.20), 0 24px 64px rgba(15, 23, 42, 0.24);
    /* ドラッグ中は揺れ・傾きの物理演出を使わず、ぼんやりした青い発光だけで「持っている」ことを示す */
    --glow-drag: 0 0 0 1px rgba(96, 165, 250, 0.45), 0 0 26px 5px rgba(59, 130, 246, 0.30), 0 14px 40px rgba(15, 23, 42, 0.18);
    --glass-blur: saturate(1.5) blur(18px);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    /* CSS linear() によるスプリング（減衰バネ）イージング。非対応ブラウザでは宣言ごと無視され標準イージングになる */
    --ease-spring: linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.281 6.5%, 0.723 12.2%, 0.938 16.2%, 1.017, 1.077 20.4%, 1.121, 1.149 24.3%, 1.159, 1.163 27%, 1.154, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Segoe UI", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- ネット背景（2枚のレイヤーをクロスフェード） ---- */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -3;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.4s ease;
    pointer-events: none;
  }
  .bg-layer.visible { opacity: 1; }
  #bgScrim {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(15,23,42,0.28), rgba(15,23,42,0.06) 30%, rgba(15,23,42,0.14));
  }

  /* ---- アプリバー ---- */
  .appbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.62);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid rgba(255, 255, 255, 0.55);
    box-shadow: var(--shadow-sm);
  }
  .appbar-title {
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .appbar-search {
    flex: 1;
    min-width: 160px;
    max-width: 340px;
    position: relative;
  }
  .appbar-search input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.85);
    font-family: inherit;
    font-size: 13px;
  }
  .appbar-search::before {
    content: "🔍";
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    opacity: 0.6;
    pointer-events: none;
  }
  .appbar-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .appbar-hint {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  main {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
  }
  /* タスクボードのセクションは透明にして、背景画像がそのまま見えるようにする（各月パネル自体は白背景で可読性を保つ） */
  .board-panel {
    background: none;
    border: none;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    padding: 0;
  }
  .panel h2 {
    font-size: 14px;
    margin: 0 0 10px;
    color: #1e2f52;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* ---- 設定・リマインダーチェック・名簿は画面に常時非表示。各月パネルのリンクから共有モーダルでのみ表示する ---- */
  .modal-only { display: none; }
  .settings-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 12px;
    align-items: center;
    max-width: 480px;
  }
  .settings-grid label { color: var(--muted); }
  .settings-grid input[type=text], .settings-grid input[type=number] {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 100%;
    font-family: inherit;
    font-size: 13px;
  }
  .settings-grid input[type=color] {
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 60px;
    height: 28px;
    cursor: pointer;
  }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: var(--blue);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), var(--shadow-sm);
    transition: transform 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out), filter 0.15s ease, background 0.15s ease;
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), var(--shadow-md);
    filter: brightness(1.06);
  }
  button:active:not(:disabled) { transform: translateY(0) scale(0.96); }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.secondary { background: var(--green); }
  button.danger { background: var(--red); }
  button.plain { background: #6b7280; }
  button.ghost {
    background: rgba(255, 255, 255, 0.78);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.ghost:hover:not(:disabled) { background: #fff; filter: none; }
  button.small { padding: 3px 8px; font-size: 11px; }
  button:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- スクロールバー / モーション設定 ---- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(15, 23, 42, 0.25);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: rgba(15, 23, 42, 0.4); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  /* ---- トースト通知（popover=トップレイヤー表示で、モーダルより手前に出す） ---- */
  #toasts {
    position: fixed;
    inset: auto 16px 16px auto;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
    margin: 0;
    padding: 0;
    border: none;
    background: transparent;
    overflow: visible;
    pointer-events: none;
  }
  #toasts .toast { pointer-events: auto; }
  #toasts:popover-open { display: flex; }
  .toast {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: min(420px, 90vw);
    background: rgba(17, 24, 39, 0.92);
    color: #fff;
    padding: 10px 14px;
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    font-size: 13px;
    animation: toast-in 0.3s var(--ease-out);
    animation: toast-in 0.55s var(--ease-spring);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .toast button {
    background: rgba(255, 255, 255, 0.16);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    box-shadow: none;
    flex: none;
  }
  .toast.hide { opacity: 0; transform: translateY(6px); transition: all 0.3s ease; }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(16px) scale(0.95); }
    to { opacity: 1; transform: none; }
  }

  /* ステータス：ドット付きの淡色ピル（塗りつぶしより現代的で、カードの中で悪目立ちしない） */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 1px 8px 1px 7px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.7;
    white-space: nowrap;
  }
  .status-badge::before {
    content: "";
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-badge.status-未完了 { background: rgba(59, 130, 246, 0.13); color: #1d4ed8; }
  .status-badge.status-進行中 { background: rgba(245, 158, 11, 0.16); color: #b45309; }
  .status-badge.status-完了 { background: rgba(16, 185, 129, 0.14); color: #047857; }

  /* ---- kanban board ---- */
  #boardView { overflow: hidden; cursor: grab; min-height: 62vh; }
  #boardView.panning { cursor: grabbing; }
  .kanban-columns {
    position: relative;
  }
  .kb-col {
    position: absolute;
    background: rgba(255, 255, 255, 0.88);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    backdrop-filter: saturate(1.4) blur(10px);
    /* 明るい縁＋外側の極細ヘアラインで、ガラスパネルの厚みを表現する */
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    min-height: 160px;
    box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.06), var(--shadow-sm);
    transition: transform 0.2s var(--ease-out), box-shadow 0.25s ease;
  }
  .kb-col.collapsed { min-height: 0; }
  .kb-col.current-month { box-shadow: 0 0 0 2px #ff8c00; }
  .kb-col.dragging-col {
    box-shadow: var(--glow-drag) !important;
    opacity: 0.97;
    will-change: left, top;
  }
  .kb-col-hdr {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.01em;
    padding: 8px 10px;
    border-radius: 13px 13px 0 0;
    cursor: grab;
    user-select: none;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .kb-col-hdr-label {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .kb-col-count {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    font-size: 10px;
    line-height: 1;
    font-weight: bold;
  }
  .kb-col-hdr-collapsed {
    justify-content: center;
    padding: 8px;
  }
  .kb-col-count-lg {
    width: 30px;
    height: 30px;
    font-size: 14px;
  }
  .kb-col-pct-badge {
    flex: none;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(255,255,255,0.35);
    font-size: 10px;
    font-weight: bold;
    white-space: nowrap;
  }
  .kb-col-menu-btn {
    flex: none;
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 4px;
    background: rgba(255,255,255,0.25);
    color: inherit;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .kb-col-menu-btn:hover { background: rgba(255,255,255,0.4); }
  .kb-col.collapsed .kb-col-hdr { border-radius: 13px; }
  /* ヘッダー直下の達成率プログレスバー（展開時のみ、タスクがある月に表示） */
  .kb-col-progress {
    flex: none;
    height: 4px;
    background: rgba(15, 23, 42, 0.08);
    overflow: hidden;
  }
  .kb-col-progress i {
    display: block;
    height: 100%;
    border-radius: 0 999px 999px 0;
    background: linear-gradient(90deg, #34d399, var(--green));
    transition: width 0.6s var(--ease-out);
  }
  /* ドロップ候補：静かな発光のみ（!importantでインラインの影プリセットより優先） */
  .kb-col.drop-target {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.10), 0 0 36px 8px rgba(37, 99, 235, 0.30) !important;
  }
  .kb-col.drop-target .kb-cards { background-color: rgba(37, 99, 235, 0.06); }
  .kb-cards {
    flex: 1;
    padding: 8px;
    position: relative;
    min-height: 0;
    overflow: auto;
    font-size: calc(11px * var(--kb-font-scale, 1));
    /* 「カードを自由に置けるキャンバス」であることを示す微細なドットグリッド */
    background-image: radial-gradient(rgba(15, 23, 42, 0.07) 1px, transparent 1.5px);
    background-size: 16px 16px;
    scrollbar-width: thin;
    transition: background-color 0.2s ease;
  }
  .kb-col-tile-icon {
    position: absolute;
    top: -6px;
    right: -6px;
    font-size: 14px;
    line-height: 1;
    z-index: 1;
  }
  .kb-col-menu {
    position: absolute;
    top: 36px;
    right: 6px;
    /* 選択中カード（z-index: 1000+連番）より常に手前に出す */
    z-index: 100000;
    background: rgba(255, 255, 255, 0.96);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 150px;
    animation: menu-in 0.15s ease;
  }
  @keyframes menu-in {
    from { opacity: 0; transform: translateY(-4px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }
  .kb-col-menu-item {
    text-align: left;
    background: none;
    border: none;
    padding: 6px 8px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: normal;
    color: var(--text);
    cursor: pointer;
    box-shadow: none;
  }
  .kb-col-menu-item:hover { background: #eef1f6; transform: none; filter: none; box-shadow: none; }
  .kb-col-menu-field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .kb-col-menu-field-row input[type=color] {
    width: 24px;
    height: 20px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
  }
  .kb-col-menu-field-row select {
    font-size: 12px;
    padding: 2px 4px;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
  }
  .kb-col-resize {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 15px;
    height: 15px;
    cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 0 45%, var(--muted) 45% 55%, transparent 55% 100%);
    border-radius: 0 0 6px 0;
  }
  .kb-card {
    position: absolute;
    width: 128px;
    background: var(--panel-solid);
    background: linear-gradient(180deg, #ffffff, #f7f9fc);
    border: 1px solid var(--border);
    border-left: 4px solid #999;
    border-radius: 12px;
    padding: 7px 9px;
    font-size: 1em;
    line-height: 1.35;
    cursor: grab;
    touch-action: none;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s var(--ease-out), transform 0.2s var(--ease-out), opacity 0.2s ease, filter 0.2s ease;
  }
  .kb-card-resize {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 12px;
    height: 12px;
    cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 0 48%, var(--muted) 48% 58%, transparent 58% 100%);
    border-radius: 0 0 8px 0;
    opacity: 0.65;
  }
  .kb-card .t-detail .edit-months {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }
  .kb-card .t-detail .edit-months .em-btn {
    padding: 2px 0;
    min-width: 26px;
    font-size: 0.95em;
    font-weight: normal;
    border-radius: 7px;
    background: #e8ecf2;
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .kb-card .t-detail .edit-months .em-btn.on {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
    font-weight: bold;
  }
  .kb-card .t-detail .edit-months .em-btn.primary-month {
    background: #2b3f63;
    color: #fff;
    border-color: #2b3f63;
    cursor: default;
    font-weight: bold;
  }
  .kb-card .t-month {
    display: inline-block;
    flex: none;
    padding: 0 7px;
    border-radius: 999px;
    font-size: 0.92em;
    font-weight: 600;
    white-space: nowrap;
  }
  .kb-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  /* 完了タスクは打ち消し線＋やや退色させ、残タスクが浮かび上がるようにする */
  .kb-card.status-完了 { opacity: 0.82; }
  .kb-card.status-完了 .t-name { text-decoration: line-through; color: var(--muted); }
  .kb-card.dimmed { opacity: 0.22; filter: grayscale(0.6); }
  .kb-card.selected {
    outline: 2px solid var(--accent);
    width: 220px;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14), var(--shadow-md);
  }
  /* ドラッグ中：pointer-events を切って真下のドロップ先を正しく検出させる。
     揺れ・傾きは付けず、わずかな拡大とぼんやりした発光だけで持ち上がりを表す */
  .kb-card.dragging {
    cursor: grabbing;
    transform: scale(1.02);
    box-shadow: var(--glow-drag);
    opacity: 0.96;
    pointer-events: none;
    will-change: left, top;
  }
  /* 持ち上げた元の位置に残る破線プレースホルダー */
  .kb-card-ghost {
    position: absolute;
    border: 2px dashed rgba(37, 99, 235, 0.45);
    border-radius: 10px;
    background: rgba(37, 99, 235, 0.06);
    pointer-events: none;
    animation: ghost-in 0.2s var(--ease-out);
  }
  @keyframes ghost-in {
    from { opacity: 0; transform: scale(0.96); }
  }
  .kb-card .t-name {
    font-weight: 700;
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
  }
  .kb-card.selected .t-name { -webkit-line-clamp: unset; line-clamp: unset; }
  /* メタ情報：月バッジ＋期日チップの行、ステータスピル＋担当者アバターのフッター行 */
  .kb-card .t-chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 3px;
    margin-top: 4px;
  }
  .kb-card .t-due {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 0 7px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.06);
    color: var(--muted);
    font-size: 0.92em;
    line-height: 1.7;
    white-space: nowrap;
  }
  .kb-card .t-due.soon { background: rgba(245, 158, 11, 0.16); color: #b45309; font-weight: 600; }
  .kb-card .t-due.overdue { background: rgba(239, 68, 68, 0.13); color: #dc2626; font-weight: 700; }
  .kb-card .t-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    margin-top: 5px;
  }
  .kb-card .t-avatar {
    flex: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.9em;
    font-weight: 700;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 1px 3px rgba(15, 23, 42, 0.25);
  }
  .kb-card .status-badge { font-size: 1em; }
  .kb-card .t-chip-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .kb-card .t-chip {
    padding: 0 7px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.06);
    color: var(--muted);
    font-size: 0.95em;
    line-height: 1.7;
    white-space: nowrap;
  }
  .kb-card .t-detail {
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 1.09em;
  }
  .kb-card .t-detail label { display: flex; flex-direction: column; gap: 3px; }
  .kb-card .t-detail input, .kb-card .t-detail select {
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #f8fafc;
    font-size: inherit;
    color: var(--text);
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .kb-card .t-detail input:focus, .kb-card .t-detail select:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .kb-card .t-detail .edit-delete {
    background: rgba(239, 68, 68, 0.08);
    color: #dc2626;
    border: 1px solid rgba(239, 68, 68, 0.35);
    box-shadow: none;
    font-weight: 600;
  }
  .kb-card .t-detail .edit-delete:hover:not(:disabled) {
    background: rgba(239, 68, 68, 0.16);
    filter: none;
    box-shadow: none;
  }
  /* 展開トグルの矢印：カード右下の丸いシェブロン。展開すると180度回転する */
  .kb-card .t-foot-right { display: flex; align-items: center; gap: 5px; }
  .kb-card .t-caret {
    flex: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(15, 23, 42, 0.06);
    color: var(--muted);
    transition: transform 0.3s var(--ease-out), background 0.2s ease, color 0.2s ease;
  }
  .kb-card:hover .t-caret { background: rgba(37, 99, 235, 0.10); color: var(--accent); }
  .kb-card.selected .t-caret {
    transform: rotate(180deg);
    background: rgba(37, 99, 235, 0.12);
    color: var(--accent);
  }
  /* 展開した詳細はふわっとスライドイン */
  .kb-card .t-detail { animation: detail-in 0.25s var(--ease-out); }
  @keyframes detail-in {
    from { opacity: 0; transform: translateY(-5px); }
  }
  .kb-card .t-detail .f-label {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.92em;
    font-weight: 600;
    color: var(--muted);
  }
  .kb-card .t-detail .f-hint { font-weight: 400; opacity: 0.75; font-size: 0.88em; }
  .kb-card .t-detail .kb-field { display: flex; flex-direction: column; gap: 3px; }

  /* ステータスのカスタムプルダウン：トリガーの矢印が回転し、選択肢がスライドして開く */
  .kb-select-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #f8fafc;
    color: var(--text);
    font-size: inherit;
    font-weight: 600;
    text-align: left;
    box-shadow: none;
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .kb-select-trigger:hover:not(:disabled) { transform: none; filter: none; background: #fff; box-shadow: none; }
  .kb-select.open .kb-select-trigger {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .kb-select-caret { flex: none; margin-left: auto; opacity: 0.55; transition: transform 0.3s var(--ease-out), opacity 0.2s ease; }
  .kb-select.open .kb-select-caret { transform: rotate(180deg); opacity: 1; }
  .kb-select-menu {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition: grid-template-rows 0.3s var(--ease-out), opacity 0.22s ease;
  }
  .kb-select.open .kb-select-menu { grid-template-rows: 1fr; opacity: 1; }
  .kb-select-menu-inner {
    overflow: hidden;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-top: 3px;
  }
  .kb-select-opt {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border: none;
    border-radius: 7px;
    background: none;
    color: var(--text);
    font-size: inherit;
    font-weight: 500;
    text-align: left;
    box-shadow: none;
  }
  .kb-select-opt:hover:not(:disabled) { background: #eef2f9; transform: none; filter: none; box-shadow: none; }
  .kb-select-opt.on { background: rgba(37, 99, 235, 0.08); font-weight: 700; }
  .kb-select-opt .check { margin-left: auto; color: var(--accent); font-weight: 700; }
  .kb-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #999; }
  .kb-dot.status-dot-未完了 { background: var(--blue); }
  .kb-dot.status-dot-進行中 { background: var(--orange); }
  .kb-dot.status-dot-完了 { background: var(--green); }
  .kb-card.status-未完了 { border-left-color: var(--blue); }
  .kb-card.status-進行中 { border-left-color: var(--orange); }
  .kb-card.status-完了 { border-left-color: var(--green); }
  .empty-msg {
    color: var(--muted);
    font-size: 12px;
    margin: 10px;
    padding: 16px 10px;
    text-align: center;
    line-height: 1.7;
    border: 1.5px dashed rgba(15, 23, 42, 0.16);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.55);
  }
  .empty-msg::before {
    content: "🗂";
    display: block;
    font-size: 17px;
    opacity: 0.75;
  }

  /* ---- reminder log ---- */
  #reminderLog {
    max-height: 220px;
    overflow-y: auto;
    font-size: 12px;
    background: rgba(248, 250, 252, 0.9);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
    white-space: pre-wrap;
  }
  #reminderLog:empty::before { content: "（まだチェックを実行していません）"; color: var(--muted); }

  dialog {
    border: none;
    border-radius: var(--radius);
    padding: 0;
    width: 380px;
    max-width: 92vw;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transform: translateY(14px) scale(0.97);
    /* allow-discrete + @starting-style による開閉トランジション（非対応ブラウザは即時表示のまま） */
    transition: opacity 0.22s var(--ease-out), transform 0.22s var(--ease-out),
                overlay 0.22s ease allow-discrete, display 0.22s ease allow-discrete;
  }
  dialog[open] { opacity: 1; transform: none; }
  @starting-style {
    dialog[open] { opacity: 0; transform: translateY(14px) scale(0.97); }
  }
  dialog::backdrop {
    background: rgba(15, 23, 42, 0.45);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    transition: background 0.22s ease, overlay 0.22s ease allow-discrete, display 0.22s ease allow-discrete;
  }
  @starting-style {
    dialog[open]::backdrop { background: rgba(15, 23, 42, 0); }
  }
  dialog form { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  dialog h3 { margin: 0 0 4px; font-size: 15px; }
  dialog label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  dialog input {
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
  }
  dialog .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  /* ---- AIアシスタントパネル ---- */
  #aiPanel {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 500;
    width: 380px;
    max-width: calc(100vw - 32px);
    height: 520px;
    max-height: calc(100vh - 90px);
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.92);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  #aiPanel[hidden] { display: none; }
  .ai-panel-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    font-weight: 700;
    font-size: 13px;
    background: #2b3f63;
    color: #fff;
    cursor: move;
    user-select: none;
  }
  .ai-panel-hdr button {
    background: rgba(255,255,255,0.18);
    padding: 2px 8px;
    font-size: 12px;
    box-shadow: none;
  }
  #aiMessages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
  }
  .ai-msg {
    max-width: 88%;
    padding: 8px 11px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ai-msg.user {
    align-self: flex-end;
    background: var(--blue);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .ai-msg.assistant {
    align-self: flex-start;
    background: #eef1f6;
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .ai-msg.info {
    align-self: center;
    background: none;
    color: var(--muted);
    font-size: 11.5px;
    padding: 2px 6px;
  }
  .ai-msg.error {
    align-self: flex-start;
    background: #fee2e2;
    color: #991b1b;
  }
  .ai-msg.thinking-dots::after {
    content: "…";
    animation: ai-dots 1.2s steps(4) infinite;
  }
  @keyframes ai-dots {
    0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; }
  }
  #aiForm {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: rgba(255,255,255,0.7);
  }
  #aiInput {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
  }

  dialog.panel-modal {
    width: 480px;
    max-width: 92vw;
  }
  .panel-modal-body {
    padding: 16px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .panel-modal-body .panel {
    border: none;
    padding: 0;
  }
  .panel-modal-body .modal-only { display: block; }
  .panel-modal-footer {
    padding: 0 16px 16px;
    display: flex;
    justify-content: flex-end;
  }

</style>
</head>
<body>

<!-- ネット背景（2枚をクロスフェード）＋可読性用スクリム -->
<div class="bg-layer" id="bgA"></div>
<div class="bg-layer" id="bgB"></div>
<div id="bgScrim"></div>

<!-- アプリバー：主要操作へ常時1クリックでアクセス -->
<header class="appbar">
  <span class="appbar-title">📋 Todoリマインダー</span>
  <span class="appbar-search">
    <input type="search" id="searchInput" placeholder="タスク・担当者を検索（/）" autocomplete="off">
  </span>
  <span class="appbar-actions">
    <button type="button" id="btnAddTaskTop" title="タスクを追加（N）">＋ タスク追加</button>
    <button type="button" id="btnAddBoardTop" class="secondary" title="ボードを追加">▦ ボード追加</button>
    <button type="button" id="btnOpenAi" class="ghost" title="AIアシスタントを開く">🤖 AI</button>
    <button type="button" id="btnBgChange" class="ghost" title="背景をランダムに変更（B）">🖼 背景</button>
    <button type="button" id="btnOpenReminder" class="ghost" title="リマインダーチェックを開く">🔔 リマインダー</button>
    <button type="button" id="btnOpenContacts" class="ghost" title="名簿を開く">👥 名簿</button>
    <button type="button" id="btnOpenSettings" class="ghost" title="設定を開く">⚙ 設定</button>
  </span>
</header>

<main>

  <section class="panel modal-only" id="sectionSettings">
    <h2>設定</h2>
    <div class="panel-body" id="settingsPanelBody">
      <div class="settings-grid">
        <label for="cfgReminderDays">既定のリマインド日数前</label>
        <input type="number" id="cfgReminderDays" min="0" value="3">

        <label for="cfgSignature">署名</label>
        <input type="text" id="cfgSignature" value="Todoリマインダーシステム">

        <label for="cfgAutoMail">自動メール送信（ON/OFF）</label>
        <span class="toggle">
          <input type="checkbox" id="cfgAutoMail">
          <span id="cfgAutoMailLabel">OFF（ブラウザ版は常にドライラン）</span>
        </span>

        <label for="cfgBgOnline">背景：ネット画像を使う</label>
        <span class="toggle">
          <input type="checkbox" id="cfgBgOnline" checked>
          <span id="cfgBgOnlineLabel">ON（ネットからランダム取得）</span>
        </span>

        <label for="cfgBgInterval">背景の自動切替間隔（分）</label>
        <input type="number" id="cfgBgInterval" min="1" value="10">

        <label for="cfgAiProvider">AI：プロバイダ</label>
        <select id="cfgAiProvider" style="padding:6px 8px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:13px; max-width:240px;">
          <option value="anthropic">Claude（Anthropic）</option>
          <option value="gemini">Gemini（Google）</option>
        </select>

        <label for="cfgApiKey">AI：Anthropic APIキー</label>
        <span>
          <input type="password" id="cfgApiKey" placeholder="sk-ant-..." autocomplete="off" style="width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:13px;">
          <button type="button" id="btnPasteApiKey" class="ghost small" style="margin-top:4px;">📋 コピーしたキーを貼り付け</button>
        </span>

        <label for="cfgGeminiKey">AI：Gemini APIキー</label>
        <span>
          <input type="password" id="cfgGeminiKey" placeholder="AIza..." autocomplete="off" style="width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:13px;">
          <button type="button" id="btnPasteGeminiKey" class="ghost small" style="margin-top:4px;">📋 コピーしたキーを貼り付け</button>
          <small style="color:var(--muted); display:block; margin-top:2px;">キーは https://aistudio.google.com/apikey で無料発行できます。入力すると自動でGeminiに切り替わります。<br>キーはこのブラウザの localStorage にのみ保存されます（外部送信は選択したAIのAPIのみ）</small>
        </span>
      </div>
    </div>
  </section>

  <section class="panel modal-only" id="sectionReminder">
    <h2>
      リマインダーチェック
      <span class="btn-row">
        <button id="btnCheck">リマインド送信チェック</button>
        <button id="btnReset" class="secondary">送信済みフラグをリセット</button>
      </span>
    </h2>
    <div class="panel-body" id="reminderPanelBody">
      <div id="reminderLog"></div>
    </div>
  </section>

  <section class="panel board-panel">
    <div id="boardView">
      <div class="kanban-columns" id="kanbanColumns"></div>
    </div>
  </section>

  <section class="panel modal-only" id="sectionContacts">
    <h2>
      <span id="contactsTitle">名簿</span>
      <span class="btn-row"><button id="btnAddContact" class="secondary small">担当者を追加</button></span>
    </h2>
    <div class="panel-body" id="contactsPanelBody">
      <table style="width:100%; border-collapse:collapse;">
        <thead>
          <tr style="background:#2b3f63; color:#fff; font-size:12px;">
            <th style="text-align:left; padding:6px 8px;">名前</th>
            <th style="text-align:left; padding:6px 8px;">メールアドレス</th>
            <th style="text-align:left; padding:6px 8px;">部署</th>
            <th style="text-align:left; padding:6px 8px;">関与タスク</th>
            <th style="padding:6px 8px;"></th>
          </tr>
        </thead>
        <tbody id="contactBody"></tbody>
      </table>
    </div>
  </section>

</main>


<!-- 各月パネルの「設定/リマインダー/名簿」リンクから開く共有モーダル -->
<!-- 中身は既存パネル（sectionSettings 等）をそのまま移動して表示するため、データや操作は常に1つに共有される -->
<dialog id="panelModal" class="panel-modal">
  <div class="panel-modal-body" id="panelModalBody"></div>
  <div class="panel-modal-footer">
    <button type="button" class="plain small" id="panelModalClose">閉じる</button>
  </div>
</dialog>

<!-- タスク追加ダイアログ -->
<dialog id="taskDialog">
  <form id="taskForm">
    <h3 id="taskDialogTitle">タスク追加</h3>
    <label>タスク名 <input type="text" id="taskName" required></label>
    <label>担当者名（名簿と一致） <input type="text" id="taskAssignee" list="assigneeList"></label>
    <datalist id="assigneeList"></datalist>
    <label>期日（yyyy/mm/dd） <input type="text" id="taskDue" required></label>
    <label>リマインド日数前 <input type="number" id="taskReminderDays" min="0" value="3"></label>
    <div class="dlg-actions">
      <button type="button" class="plain" id="taskCancel">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>

<!-- AIアシスタントパネル（ヘッダーの🤖AIボタンで開閉） -->
<div id="aiPanel" hidden>
  <div class="ai-panel-hdr">
    <span>🤖 AIアシスタント</span>
    <span style="display:flex; gap:6px;">
      <button type="button" id="aiClear" title="会話をクリア">クリア</button>
      <button type="button" id="aiClose" title="閉じる">✕</button>
    </span>
  </div>
  <div id="aiMessages"></div>
  <form id="aiForm">
    <input type="text" id="aiInput" placeholder="タスクについて質問・依頼…" autocomplete="off">
    <button type="submit" id="aiSendBtn">送信</button>
  </form>
</div>

<!-- トースト通知（popover: モーダルダイアログより手前のトップレイヤーに表示される） -->
<div id="toasts" popover="manual"></div>

<!-- 担当者追加ダイアログ -->
<dialog id="contactDialog">
  <form id="contactForm">
    <h3>担当者を追加</h3>
    <label>名前 <input type="text" id="contactName" required></label>
    <label>メールアドレス <input type="text" id="contactEmail" required></label>
    <label>部署 <input type="text" id="contactDept"></label>
    <div class="dlg-actions">
      <button type="button" class="plain" id="contactCancel">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>

<!-- ローカル設定（git管理外の browser/config.local.js。無ければ404で単に無視される） -->
<script src="config.local.js"></script>
<script>
(function () {
  "use strict";

  const STORAGE_KEY = "todoReminder.v1";
  const STATUSES = ["未完了", "進行中", "完了"];

  const defaultState = () => ({
    settings: {
      reminderDays: 3,
      signature: "Todoリマインダーシステム",
      autoMailOn: false,
      bgOnline: true,
      bgIntervalMin: 10,
      aiProvider: "anthropic",
      anthropicApiKey: "",
      geminiApiKey: ""
    },
    tasks: [
      { id: 1, name: "プロジェクト報告書提出", assignee: "山田太郎", due: "2026-07-15", reminderDays: 3, status: "未完了", sentFlag: "", boards: ["b1"] },
      { id: 2, name: "請求書チェック", assignee: "鈴木花子", due: "2026-07-13", reminderDays: 1, status: "進行中", sentFlag: "", boards: ["b1"] }
    ],
    contacts: [
      { name: "山田太郎", email: "yamada@example.com", dept: "営業部" },
      { name: "鈴木花子", email: "suzuki@example.com", dept: "経理部" }
    ],
    nextTaskId: 3,
    boards: [{ id: "b1", name: "ボード1" }],
    nextBoardId: 2,
    boardPos: {},
    boardGroups: [],
    aiPanelPos: null
  });

  let state = load();

  // ローカル設定ファイル（config.local.js、git管理外）からAPIキーの初期値を取り込む。
  // 設定画面でキーが未入力のときだけ適用するので、手入力したキーが上書きされることはない。
  if (window.LOCAL_CONFIG) {
    let lcChanged = false;
    if (window.LOCAL_CONFIG.geminiApiKey && !state.settings.geminiApiKey) {
      state.settings.geminiApiKey = window.LOCAL_CONFIG.geminiApiKey;
      state.settings.aiProvider = "gemini";
      lcChanged = true;
    }
    if (window.LOCAL_CONFIG.anthropicApiKey && !state.settings.anthropicApiKey) {
      state.settings.anthropicApiKey = window.LOCAL_CONFIG.anthropicApiKey;
      lcChanged = true;
    }
    if (lcChanged) save();
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      const merged = Object.assign(defaultState(), parsed);
      merged.settings = Object.assign(defaultState().settings, parsed.settings || {});
      return migrateToFreeBoards(merged, parsed);
    } catch (e) {
      console.error("localStorage の読み込みに失敗しました。初期データを使用します。", e);
      return defaultState();
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // 旧形式（1〜12月の固定月ボード＋期日から所属を導出）からの移行。
  // タスクが存在する月（＋結合に含まれる月）だけを同名の自由ボードに変換し、
  // 位置・見た目・結合状態・タスクの所属を引き継ぐ。extraMonths は task.boards に統合される。
  function migrateToFreeBoards(s, parsed) {
    if (Array.isArray(s.tasks)) s.tasks.forEach(t => { if (!Array.isArray(t.boards)) t.boards = null; });
    const isOld = s.monthPos !== undefined || s.monthGroups !== undefined ||
      (s.tasks || []).some(t => t.boards === null);
    if (!isOld) return s;
    // 保存データが旧形式のときは、defaultState 由来のボード（「ボード1」）は捨ててゼロから構築する
    const hadBoards = parsed && Array.isArray(parsed.boards) && parsed.boards.length > 0;
    if (!hadBoards) {
      s.boards = [];
      s.nextBoardId = 1;
      s.boardPos = {};
      s.boardGroups = [];
    }
    const oldPos = s.monthPos || {};
    const oldGroups = (s.monthGroups || []).map(g => g.slice());
    const monthKeyOfT = t => {
      const d = parseDue(t.due);
      return d ? `${d.getFullYear()}-${pad2(d.getMonth() + 1)}` : "unset";
    };
    const monthsOfTask = t => {
      const p = monthKeyOfT(t);
      return [p, ...(t.extraMonths || []).filter(k => k !== p)];
    };
    const monthSet = new Set();
    (s.tasks || []).forEach(t => monthsOfTask(t).forEach(k => monthSet.add(k)));
    oldGroups.forEach(g => g.forEach(k => monthSet.add(k)));
    const labelOf = k => {
      if (k === "unset") return "期日未設定";
      const [y, m] = k.split("-").map(Number);
      return (y === new Date().getFullYear()) ? `${m}月` : `${y}年${m}月`;
    };
    const idOf = {};
    let n = Math.max(1, s.nextBoardId || 1);
    const boards = Array.isArray(s.boards) ? s.boards.slice() : [];
    [...monthSet].sort().forEach(k => {
      const id = "b" + (n++);
      idOf[k] = id;
      boards.push({ id, name: labelOf(k) });
    });
    if (!boards.length) boards.push({ id: "b" + (n++), name: "ボード1" });
    s.boards = boards;
    s.nextBoardId = n;
    s.boardPos = s.boardPos || {};
    Object.keys(oldPos).forEach(k => {
      const parts = k.split("+");
      const ids = parts.map(m => idOf[m]).filter(Boolean);
      if (ids.length === parts.length) s.boardPos[ids.slice().sort().join("+")] = oldPos[k];
    });
    s.boardGroups = (s.boardGroups || []).concat(
      oldGroups.map(g => g.map(m => idOf[m]).filter(Boolean)).filter(g => g.length >= 2));
    (s.tasks || []).forEach(t => {
      if (!Array.isArray(t.boards) || !t.boards.length) {
        t.boards = [...new Set(monthsOfTask(t).map(m => idOf[m]).filter(Boolean))];
      }
      if (!t.boards.length) t.boards = [s.boards[0].id];
      delete t.extraMonths;
    });
    delete s.monthPos;
    delete s.monthGroups;
    return s;
  }

  // ---------------------------------------------------------------
  // 日付ユーティリティ
  // ---------------------------------------------------------------
  function todayDate() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function parseDue(due) {
    if (!due) return null;
    const d = new Date(due + "T00:00:00");
    return isNaN(d.getTime()) ? null : d;
  }
  function daysBetween(today, due) {
    return Math.round((due.getTime() - today.getTime()) / 86400000);
  }
  function formatDate(d) {
    if (!d) return "";
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}/${m}/${day}`;
  }
  function formatDateJP(d) {
    return `${d.getFullYear()}年${String(d.getMonth() + 1).padStart(2, "0")}月${String(d.getDate()).padStart(2, "0")}日`;
  }
  function normalizeDueInput(v) {
    // "yyyy/mm/dd" 等の入力を "yyyy-mm-dd" に正規化
    const m = v.trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if (!m) return null;
    const [, y, mo, da] = m;
    return `${y}-${mo.padStart(2, "0")}-${da.padStart(2, "0")}`;
  }
  function pad2(n) { return String(n).padStart(2, "0"); }

  // ---- 自由ボード（ユーザーが好きな数だけ作成できる名前付きボード） ----
  function boardById(id) { return state.boards.find(b => b.id === id) || null; }
  // タスクが所属するボードid一覧。存在しないボードへの参照は除外し、空になったら先頭ボードへ割り当てる。
  function taskBoardIds(task) {
    let ids = (task.boards || []).filter(id => boardById(id));
    if (!ids.length && state.boards.length) {
      ids = [state.boards[0].id];
      task.boards = ids;
    }
    return ids;
  }

  // ---- ボードの結合（複数ボードを1枚にまとめる） ----
  // 結合ボードのキーは対象ボードidをソートして "+" で連結したもの（例: "b1+b3"）。
  // state.boardGroups には結合中のボードid配列を保持する（例: [["b1","b3"]]）。
  const GROUP_SEP = "+";
  function isGroupKey(key) { return key.includes(GROUP_SEP); }
  function boardsOfKey(key) { return key.split(GROUP_SEP); }
  function groupKeyOf(ids) { return ids.slice().sort().join(GROUP_SEP); }
  function findGroup(boardId) {
    return state.boardGroups.find(g => g.includes(boardId)) || null;
  }
  // 表示するボードのキー一覧（結合中のボードは1枚の結合ボードにまとめる）
  function getBoardKeys() {
    const seen = new Set();
    const result = [];
    for (const b of state.boards) {
      const g = findGroup(b.id);
      if (g) {
        const gk = groupKeyOf(g);
        if (!seen.has(gk)) { seen.add(gk); result.push(gk); }
      } else {
        result.push(b.id);
      }
    }
    return result;
  }
  function boardLabel(key) {
    return boardsOfKey(key).map(id => (boardById(id) || { name: "?" }).name).join("＋");
  }
  // 折りたたみタイル用の短縮ラベル。単独ボードは名前の先頭2文字、結合ボードは各名の頭文字を","区切りで。
  function boardShortLabel(key) {
    const ids = boardsOfKey(key);
    if (ids.length === 1) return [...(boardById(ids[0]) || { name: "?" }).name].slice(0, 2).join("");
    return ids.map(id => [...(boardById(id) || { name: "?" }).name][0] || "?").join(",");
  }
  function canMergeBoards(a, b) {
    return !!a && !!b && a !== b;
  }
  function mergeBoards(sourceKey, targetKey) {
    if (!canMergeBoards(sourceKey, targetKey)) return;
    const ids = [...new Set([...boardsOfKey(sourceKey), ...boardsOfKey(targetKey)])].sort();
    const newKey = groupKeyOf(ids);
    const prevGroups = state.boardGroups.map(g => g.slice());
    const hadPos = Object.prototype.hasOwnProperty.call(state.boardPos, newKey);
    state.boardGroups = state.boardGroups.filter(g => !g.some(m => ids.includes(m)));
    state.boardGroups.push(ids);
    // 結合後のボードは、結合先（ドロップされた側）の位置・見た目を引き継ぐ
    state.boardPos[newKey] = Object.assign({}, state.boardPos[targetKey]);
    save();
    renderBoard();
    // 結合されたボードが軽くポップして、どこに合体したか一目で分かるようにする
    popAnimate(kanbanColumns.querySelector(`.kb-col[data-board="${newKey}"]`));
    toast(`「${boardLabel(newKey)}」ボードに結合しました`, {
      actionLabel: "元に戻す",
      onAction: () => {
        state.boardGroups = prevGroups;
        if (!hadPos) delete state.boardPos[newKey];
        save();
        renderBoard();
      }
    });
  }
  // 解除時は結合ボードの内容（色・形・サイズ等の見た目設定と折りたたみ状態）を各ボードへ引き継ぎ、
  // 結合ボードのあった位置から横に並べて配置する。タスクの所属（task.boards）は変わらない。
  const INHERIT_POS_KEYS = ["color", "shape", "border", "fontSize", "shadow", "tileSize", "icon", "w", "h", "collapsed"];
  function groupStepX(groupPos) {
    return groupPos.collapsed
      ? TILE_SIZE_PRESET[groupPos.tileSize || "normal"].tile + 24
      : (groupPos.w || 240) + 16;
  }
  function unmergeBoard(boardKey) {
    const label = boardLabel(boardKey);
    const ids = boardsOfKey(boardKey);
    const groupPos = state.boardPos[boardKey] || {};
    state.boardGroups = state.boardGroups.filter(g => groupKeyOf(g) !== boardKey);
    const baseX = groupPos.x || 0, baseY = groupPos.y || 0;
    const stepX = groupStepX(groupPos);
    ids.forEach((m, i) => {
      const pos = state.boardPos[m] || {};
      INHERIT_POS_KEYS.forEach(k => {
        if (groupPos[k] !== undefined) pos[k] = groupPos[k];
      });
      pos.x = baseX + i * stepX;
      pos.y = baseY;
      pos.z = ++colZCounter;
      state.boardPos[m] = pos;
    });
    delete state.boardPos[boardKey];
    save();
    renderBoard();
    toast(`「${label}」ボードの結合をすべて解除しました`);
  }
  // 結合ボードから指定した1枚だけを分離する（残りは結合されたまま）。
  // 分離したボードは結合ボードの右隣に、見た目設定を引き継いで置く。
  function detachBoardFromGroup(groupKey, boardId) {
    const ids = boardsOfKey(groupKey);
    if (!ids.includes(boardId)) return;
    if (ids.length <= 2) { unmergeBoard(groupKey); return; }
    const groupPos = state.boardPos[groupKey] || {};
    const rest = ids.filter(i => i !== boardId);
    const newKey = groupKeyOf(rest);
    state.boardGroups = state.boardGroups.filter(g => groupKeyOf(g) !== groupKey);
    state.boardGroups.push(rest);
    state.boardPos[newKey] = Object.assign({}, groupPos);
    delete state.boardPos[groupKey];
    const pos = state.boardPos[boardId] || {};
    INHERIT_POS_KEYS.forEach(k => {
      if (groupPos[k] !== undefined) pos[k] = groupPos[k];
    });
    pos.x = (groupPos.x || 0) + groupStepX(groupPos);
    pos.y = groupPos.y || 0;
    pos.z = ++colZCounter;
    state.boardPos[boardId] = pos;
    save();
    renderBoard();
    popAnimate(kanbanColumns.querySelector(`.kb-col[data-board="${boardId}"]`));
    toast(`「${(boardById(boardId) || { name: "?" }).name}」を結合から分離しました`);
  }

  // ---- ボードの作成・名前変更・削除 ----
  function createBoard(name, pos) {
    const id = "b" + state.nextBoardId++;
    state.boards.push({ id, name: (name || "").trim() || `ボード${state.boards.length + 1}` });
    const openCount = getBoardKeys().length;
    state.boardPos[id] = Object.assign(
      { x: 24 + (openCount % 6) * 40, y: 24 + (openCount % 6) * 32, z: ++colZCounter, collapsed: false },
      pos || {});
    save();
    renderBoard();
    popAnimate(kanbanColumns.querySelector(`.kb-col[data-board="${id}"]`));
    return id;
  }
  function renameBoard(id) {
    const board = boardById(id);
    if (!board) return;
    const name = prompt("ボード名を入力してください", board.name);
    if (name === null || !name.trim()) return;
    board.name = name.trim();
    save();
    renderBoard();
  }
  function deleteBoard(id) {
    const board = boardById(id);
    if (!board) return;
    if (state.boards.length <= 1) { toast("最後のボードは削除できません"); return; }
    const orphanCount = state.tasks.filter(t => {
      const ids = taskBoardIds(t);
      return ids.includes(id) && ids.length === 1;
    }).length;
    const msg = orphanCount
      ? `「${board.name}」を削除しますか？\nこのボードだけに属するタスク ${orphanCount} 件は、残りの先頭ボードへ移動します。`
      : `「${board.name}」を削除しますか？`;
    if (!confirm(msg)) return;
    state.boards = state.boards.filter(b => b.id !== id);
    state.boardGroups = state.boardGroups
      .map(g => g.filter(i => i !== id))
      .filter(g => g.length >= 2);
    Object.keys(state.boardPos).forEach(k => {
      if (boardsOfKey(k).includes(id)) delete state.boardPos[k];
    });
    const fallback = state.boards[0].id;
    state.tasks.forEach(t => {
      t.boards = (t.boards || []).filter(i => i !== id);
      if (!t.boards.length) t.boards = [fallback];
    });
    save();
    renderBoard();
    toast(`「${board.name}」ボードを削除しました`);
  }
  // その月のタスク達成率を10%刻み（10段階）に丸めて返す。タスクが無い月は null（達成率表示なし）。
  function monthCompletionStep(tasks) {
    if (tasks.length === 0) return null;
    const done = tasks.filter(t => t.status === "完了").length;
    return Math.round((done / tasks.length) * 10) * 10;
  }
  // その月のタスク達成率（%、整数）。タスクが無い月は null。
  function monthCompletionPercent(tasks) {
    if (tasks.length === 0) return null;
    const done = tasks.filter(t => t.status === "完了").length;
    return Math.round((done / tasks.length) * 100);
  }
  function hexToRgb(hex) {
    const n = parseInt(hex.replace("#", ""), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  // ボードの自動見出し色：id から安定して決まるパレット色（同じボードは常に同じ色）。
  // 個別に色が指定されている場合（state.boardPos[key].color）は、そちらを優先する。
  const BOARD_COLOR_PALETTE = ["#2563eb", "#7c3aed", "#059669", "#d97706", "#dc2626", "#0891b2", "#c026d3", "#4d7c0f", "#0f766e", "#475569"];
  function boardAutoColor(id) {
    const n = parseInt(String(id).replace(/\D/g, ""), 10) || 0;
    return BOARD_COLOR_PALETTE[n % BOARD_COLOR_PALETTE.length];
  }
  function boardHeaderColor(key) {
    const custom = state.boardPos[key] && state.boardPos[key].color;
    // 結合ボードの自動色は先頭ボードを基準にする
    const hex = custom || boardAutoColor(boardsOfKey(key)[0]);
    const rgb = hexToRgb(hex);
    const brightness = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000;
    return { bg: hex, fg: brightness > 150 ? "#1f2937" : "#ffffff" };
  }

  // ---------------------------------------------------------------
  // 共有モーダル（各月パネルの「設定/リマインダー/名簿」リンクから開く）
  // 設定・リマインダーチェック・名簿は画面には常に非表示（.modal-only）で、
  // このモーダルへ既存パネル要素をそのまま移動して表示する（複製ではなく常にデータ・操作を共有）。
  // ---------------------------------------------------------------
  const PANEL_SECTION_IDS = {
    settings: "sectionSettings",
    reminder: "sectionReminder",
    contacts: "sectionContacts"
  };
  const panelModal = document.getElementById("panelModal");
  const panelModalBody = document.getElementById("panelModalBody");
  let modalReturn = null;

  function openPanelModal(key) {
    const el = document.getElementById(PANEL_SECTION_IDS[key]);
    modalReturn = { el, parent: el.parentElement, nextSibling: el.nextSibling };
    panelModalBody.appendChild(el);
    panelModal.showModal();
  }

  document.getElementById("panelModalClose").addEventListener("click", () => panelModal.close());
  panelModal.addEventListener("close", () => {
    if (!modalReturn) return;
    const { el, parent, nextSibling } = modalReturn;
    if (nextSibling) parent.insertBefore(el, nextSibling); else parent.appendChild(el);
    modalReturn = null;
    // 名簿の月スコープ・展開状態は開いている間だけ有効
    if (contactsScopeKey !== null || expandedContactName !== null) {
      contactsScopeKey = null;
      expandedContactName = null;
      renderContacts();
    }
  });

  // ---------------------------------------------------------------
  // 設定パネル
  // ---------------------------------------------------------------
  const cfgReminderDays = document.getElementById("cfgReminderDays");
  const cfgSignature = document.getElementById("cfgSignature");
  const cfgAutoMail = document.getElementById("cfgAutoMail");
  const cfgAutoMailLabel = document.getElementById("cfgAutoMailLabel");
  const cfgBgOnline = document.getElementById("cfgBgOnline");
  const cfgBgOnlineLabel = document.getElementById("cfgBgOnlineLabel");
  const cfgBgInterval = document.getElementById("cfgBgInterval");
  const cfgApiKey = document.getElementById("cfgApiKey");
  const cfgAiProvider = document.getElementById("cfgAiProvider");
  const cfgGeminiKey = document.getElementById("cfgGeminiKey");

  function renderSettings() {
    cfgReminderDays.value = state.settings.reminderDays;
    cfgSignature.value = state.settings.signature;
    cfgAutoMail.checked = state.settings.autoMailOn;
    cfgAutoMailLabel.textContent = state.settings.autoMailOn
      ? "ON（ブラウザ版は実送信できないためドライランのまま判定のみ行います）"
      : "OFF（ブラウザ版は常にドライラン）";
    cfgBgOnline.checked = state.settings.bgOnline;
    cfgBgOnlineLabel.textContent = state.settings.bgOnline
      ? "ON（ネットからランダム取得）"
      : "OFF（グラデーション背景）";
    cfgBgInterval.value = state.settings.bgIntervalMin;
    cfgApiKey.value = state.settings.anthropicApiKey || "";
    cfgAiProvider.value = state.settings.aiProvider || "anthropic";

  }
  cfgReminderDays.addEventListener("change", () => {
    state.settings.reminderDays = Math.max(0, parseInt(cfgReminderDays.value, 10) || 0);
    save();
  });
  cfgSignature.addEventListener("change", () => {
    state.settings.signature = cfgSignature.value.trim() || "Todoリマインダーシステム";
    save();
  });
  cfgAutoMail.addEventListener("change", () => {
    state.settings.autoMailOn = cfgAutoMail.checked;
    renderSettings();
    save();

  cfgBgOnline.addEventListener("change", () => {
    state.settings.bgOnline = cfgBgOnline.checked;
    renderSettings();
    save();
